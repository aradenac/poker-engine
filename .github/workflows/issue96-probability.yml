name: Issue 96 probability compatibility

on:
  push:
    branches: [issue-96-preflop-contract]
    paths:
      - tools/tmp_issue96_probability.py
      - .github/workflows/issue96-probability.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-96-preflop-contract
          fetch-depth: 0
      - name: Apply runtime probability compatibility patch
        run: python3 tools/tmp_issue96_probability.py
      - name: Verify contracts and unchanged historical behavior
        run: |
          python3 -m py_compile tools/preflop/context_contract.py tools/preflop/probability_contract.py
          node --check site/preflop-contract.js
          python3 tests/preflop/test_context_contract.py
          python3 tests/preflop/test_probability_contract.py
          python3 tests/preflop/test_increment_decisions_contract.py
          python3 tests/preflop/test_site_preflop_contract.py
          python3 tests/training/test_preflop_key_runtime_parity.py
      - name: Verify release identity remains current
        run: |
          python3 tools/write_site_release.py
          python3 tools/write_site_release.py --check
      - name: Commit durable probability integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Issue #96: expose incumbent probability contract"
          git push origin HEAD:issue-96-preflop-contract
