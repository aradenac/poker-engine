name: Trace Model B refresh provenance

on:
  push:
    branches:
      - issue-38-model-b-final-20260913
    paths:
      - '.github/workflows/model-b-refresh-sequence-diagnostic.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot canonical provenance before build
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.training.independent_profiles.build_player_features import merge_archives
          paths=[Path('training/datasets/NLHE_100-200/source/NLHE 100-200.zip'),Path('training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'),Path('training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip')]
          _,p=merge_archives(paths,{'100/200'})
          print('BEFORE',json.dumps(p,indent=2))
          PY
      - name: Rebuild candidate features and K3 model
        run: |
          CYCLE='training/runs/20260912_population_increment_cycle/model_b'
          python3 tools/training/independent_profiles/build_player_features.py \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --min-hands 30 --prior-strength 40 \
            --output "$CYCLE/features/player_features.json" --summary "$CYCLE/features/summary.json"
          python3 -m tools.training.independent_profiles.build_model_b \
            --features "$CYCLE/features/player_features.json" \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --profiles 3 --output-dir "$CYCLE/model"
      - name: Snapshot provenance after build and evaluate candidate
        run: |
          CYCLE='training/runs/20260912_population_increment_cycle/model_b'
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.training.independent_profiles.build_player_features import merge_archives
          paths=[Path('training/datasets/NLHE_100-200/source/NLHE 100-200.zip'),Path('training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'),Path('training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip')]
          _,p=merge_archives(paths,{'100/200'})
          print('AFTER_BUILD',json.dumps(p,indent=2))
          assert p['sorted_hand_ids_sha256']=='4d6ec2cdebd9488b69b733a86bb41aba5b022fcd9da49be0c5ea3dbec71c52bf'
          PY
          python3 -m tools.training.independent_profiles.evaluate_model_b \
            --features "$CYCLE/features/player_features.json" --model-dir "$CYCLE/model" \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --action-alpha 1 --range-prior-strength 50 \
            --output /tmp/candidate.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/candidate.json'))
          print('CANDIDATE_DATASET',json.dumps(d['dataset'],indent=2))
          assert d['dataset']['sorted_hand_ids_sha256']=='4d6ec2cdebd9488b69b733a86bb41aba5b022fcd9da49be0c5ea3dbec71c52bf'
          assert d['dataset']['overlap_occurrences']==10534
          PY
