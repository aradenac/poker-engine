name: Apply trainer Hero custom ranges

on:
  push:
    branches: [issue-31-hero-custom-ranges]
    paths:
      - 'tools/patches/apply_trainer_hero_custom_ranges.py'
      - 'tests/trainer/test_trainer_hero_ranges.py'
      - 'tests/trainer/test_trainer_preload_contract.py'
      - 'site/assets/trainer/hero/custom_ranges_v1.json'
      - '.github/workflows/apply-trainer-hero-custom-ranges.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-31-hero-custom-ranges
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/patches/apply_trainer_hero_custom_ranges.py
      - name: Validate syntax and all trainer contracts
        run: |
          node --check site/trainer.js
          for t in tests/trainer/test_*.py; do python3 "$t"; done
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-trainer-hero-custom-ranges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Deal Hero from user custom preflop ranges'
          git push origin HEAD:issue-31-hero-custom-ranges
