name: Temporary validate continuous cycle orchestrator

on:
  push:
    branches:
      - issue-13-safe-cycle-orchestrator
    paths:
      - 'tools/training/run_continuous_cycle.py'
      - 'training/automation/**'
      - 'tests/training/test_continuous_cycle.py'
      - 'tests/test_promotion_gates.py'
      - '.github/workflows/tmp-validate-continuous-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit safety contract
        run: python3 tests/training/test_continuous_cycle.py
      - name: Rehearse closed 2026-09-12 cycle
        run: |
          python3 tools/training/run_continuous_cycle.py \
            --config training/automation/reference_cycle_20260912.json \
            --require-ready \
            --report /tmp/reference-cycle-execution.json
      - name: Verify execution report
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/reference-cycle-execution.json'))
          assert r['status']=='PASS', r
          assert r['gate']=={
              'path':'training/gates/20260912_report.json',
              'status':'PASS',
              'promotion_ready':True,
          }, r['gate']
          assert r['promotion_applied'] is False
          assert r['production_changed_paths_detected']==[]
          assert r['production_before']==r['production_after']
          assert [x['status'] for x in r['stages']]==['PASS']*len(r['stages'])
          print(json.dumps({'status':r['status'],'stages':len(r['stages']),'gate':r['gate']},indent=2))
          PY
