name: Issue 95 trainer population pack patch

on:
  push:
    branches:
      - issue-95-population-isolation-refactor
    paths:
      - 'tools/patches/issue95_trainer_population_pack.py'
      - '.github/workflows/issue95-trainer-pack-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-95-population-isolation-refactor
          fetch-depth: 0
      - name: Apply population-pack patch
        run: python3 tools/patches/issue95_trainer_population_pack.py
      - name: Validate static trainer pack
        run: |
          python3 tests/trainer/test_trainer_static.py
          node --check site/trainer.js
          python3 - <<'PY'
          import json
          d=json.load(open('site/assets/trainer/population.json'))
          assert d['schema']=='trainer-population-pack/v1'
          assert d['population_id']=='legacy_pokerstars_nlhe_100-200_play_6max_mixed_v1'
          PY
      - name: Commit tested source changes
        run: |
          git checkout -- .github/workflows/issue95-trainer-pack-patch.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'poker-engine trainer bot'
          git config user.email 'trainer-bot@users.noreply.github.com'
          git add site/trainer.js tests/trainer/test_trainer_static.py
          git status --short
          git commit -m 'Issue #95: load trainer assets from population pack'
          git push origin HEAD:issue-95-population-isolation-refactor
