name: Diagnose Model B pair provenance

on:
  push:
    branches:
      - issue-38-model-b-final-20260913
    paths:
      - '.github/workflows/model-b-pair-provenance-diagnostic.yml'

permissions:
  contents: read

jobs:
  pair-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild K3 candidate
        run: |
          CYCLE='training/runs/20260912_population_increment_cycle/model_b'
          python3 tools/training/independent_profiles/build_player_features.py \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --min-hands 30 --prior-strength 40 \
            --output "$CYCLE/features/player_features.json" --summary "$CYCLE/features/summary.json"
          python3 -m tools.training.independent_profiles.build_model_b \
            --features "$CYCLE/features/player_features.json" \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --profiles 3 --output-dir "$CYCLE/model"
      - name: Evaluate candidate and incumbent
        run: |
          CYCLE='training/runs/20260912_population_increment_cycle/model_b'
          python3 -m tools.training.independent_profiles.evaluate_model_b \
            --features "$CYCLE/features/player_features.json" --model-dir "$CYCLE/model" \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --action-alpha 1 --range-prior-strength 50 \
            --output /tmp/candidate.json
          python3 -m tools.training.independent_profiles.evaluate_model_b \
            --features 'training/runs/20260912_independent_profiles_v2/features/player_features.json' \
            --model-dir 'training/runs/20260912_independent_profiles_v2/model' \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake 100/200 --exclude-player RoiDePiqueNique --action-alpha 1 --range-prior-strength 50 \
            --output /tmp/incumbent.json
      - name: Compare three provenance identities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.training.independent_profiles.build_player_features import merge_archives
          candidate=json.load(open('/tmp/candidate.json'))['dataset']
          incumbent=json.load(open('/tmp/incumbent.json'))['dataset']
          paths=[
            Path('training/datasets/NLHE_100-200/source/NLHE 100-200.zip'),
            Path('training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'),
            Path('training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip'),
          ]
          _,direct=merge_archives(paths,{'100/200'})
          for name,d in [('candidate',candidate),('incumbent',incumbent),('direct',direct)]:
            print(name, d['unique_scoped_hands'], d['split_counts'], d['overlap_occurrences'], d['sorted_hand_ids_sha256'])
          assert candidate==incumbent==direct, (candidate, incumbent, direct)
          PY
