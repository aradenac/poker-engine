name: Full-hand evaluation protocol

on:
  pull_request:
    paths:
      - '.python-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'training/full_hand/**'
      - 'training/populations/registry.json'
      - 'training/datasets/NLHE_100-200/population_certification.json'
      - 'training/PROMOTION_GATE_CONTRACT.json'
      - 'tools/training/validate_full_hand_protocol.py'
      - 'tools/training/validate_preflop_strategy_benchmark.py'
      - 'tests/training/test_full_hand_protocol.py'
      - 'tests/training/test_preflop_strategy_benchmark.py'
      - '.github/workflows/full-hand-protocol.yml'
  push:
    branches:
      - main
    paths:
      - '.python-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'training/full_hand/**'
      - 'training/populations/registry.json'
      - 'training/datasets/NLHE_100-200/population_certification.json'
      - 'training/PROMOTION_GATE_CONTRACT.json'
      - 'tools/training/validate_full_hand_protocol.py'
      - 'tools/training/validate_preflop_strategy_benchmark.py'
      - 'tests/training/test_full_hand_protocol.py'
      - 'tests/training/test_preflop_strategy_benchmark.py'
      - '.github/workflows/full-hand-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify locked REPRO environment
        run: python3 tools/repro_ci_environment.py verify

      - name: Validate syntax and frozen protocol invariants
        run: |
          python3 -m py_compile \
            tools/training/validate_full_hand_protocol.py \
            tools/training/validate_preflop_strategy_benchmark.py \
            tests/training/test_full_hand_protocol.py \
            tests/training/test_preflop_strategy_benchmark.py
          python3 tools/training/validate_full_hand_protocol.py
          python3 tests/training/test_full_hand_protocol.py
          python3 tools/training/validate_preflop_strategy_benchmark.py
          python3 tests/training/test_preflop_strategy_benchmark.py

      - name: Preserve existing unified promotion-gate behavior
        run: |
          python3 tests/test_promotion_gates.py
