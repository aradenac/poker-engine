name: Ingest staged artifacts

on:
  push:
    paths:
      - 'artifacts/inbox/*.json'
      - 'tools/ingest_artifact.py'
      - 'tools/ingest_dispatch.py'
      - 'tools/datasets/audit_hand_history_archive.py'
      - 'tools/datasets/build_hand_history_increment.py'
      - 'tests/datasets/test_build_hand_history_increment.py'
      - 'training/datasets/NLHE_100-200/**/*.zip'
      - '.github/workflows/ingest-artifacts.yml'

permissions:
  contents: write

concurrency:
  group: artifact-ingest-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test hand-history increment builder
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/datasets/test_build_hand_history_increment.py

      - name: Import and verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/inbox/*.json)
          for manifest in "${manifests[@]}"; do
            echo "Processing $manifest"
            python3 tools/ingest_dispatch.py "$manifest"
          done

      - name: Audit NLHE hand-history archives
        shell: bash
        run: |
          set -euo pipefail
          baseline='training/datasets/NLHE_100-200/source/NLHE 100-200.zip'
          snapshot_20260909='training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'
          snapshot_20260912='training/datasets/NLHE_100-200/snapshots/20260912/source/RoiDePiqueNique.zip'
          if [ -f "$baseline" ]; then
            python3 tools/datasets/audit_hand_history_archive.py "$baseline" \
              'training/datasets/NLHE_100-200/source/manifest.json'
          fi
          if [ -f "$snapshot_20260909" ]; then
            python3 tools/datasets/audit_hand_history_archive.py "$snapshot_20260909" \
              'training/datasets/NLHE_100-200/snapshots/20260909/manifest.json'
          fi
          if [ -f "$snapshot_20260912" ]; then
            python3 tools/datasets/audit_hand_history_archive.py "$snapshot_20260912" \
              'training/datasets/NLHE_100-200/snapshots/20260912/manifest.json'
          fi

      - name: Materialize canonical 2026-09-09 100-200 ID increment
        shell: bash
        run: |
          set -euo pipefail
          baseline='training/datasets/NLHE_100-200/source/NLHE 100-200.zip'
          snapshot='training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'
          manifest='training/datasets/NLHE_100-200/increments/20260909/manifest.json'
          if [ -f "$baseline" ] && [ -f "$snapshot" ]; then
            python3 tools/datasets/build_hand_history_increment.py \
              --known "$baseline" \
              --candidate "$snapshot" \
              --stake 100/200 \
              --manifest "$manifest"
          fi

      - name: Materialize canonical 2026-09-12 100-200 ID increment
        shell: bash
        run: |
          set -euo pipefail
          baseline='training/datasets/NLHE_100-200/source/NLHE 100-200.zip'
          previous='training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'
          snapshot='training/datasets/NLHE_100-200/snapshots/20260912/source/RoiDePiqueNique.zip'
          manifest='training/datasets/NLHE_100-200/increments/20260912/manifest.json'
          selected='training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip'
          if [ -f "$baseline" ] && [ -f "$previous" ] && [ -f "$snapshot" ]; then
            python3 tools/datasets/build_hand_history_increment.py \
              --known "$baseline" \
              --known "$previous" \
              --candidate "$snapshot" \
              --stake 100/200 \
              --manifest "$manifest" \
              --output-zip "$selected"
          fi

      - name: Commit imported artifacts and dataset manifests
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No artifact changes to commit.'
            exit 0
          fi
          git config user.name 'poker-engine artifact bot'
          git config user.email 'artifact-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Import and audit persisted artifacts'
          git push
