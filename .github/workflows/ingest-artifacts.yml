name: Ingest staged artifacts

on:
  push:
    paths:
      - 'artifacts/inbox/*.json'
      - 'tools/ingest_artifact.py'
      - 'tools/ingest_dispatch.py'
      - 'tests/datasets/test_build_hand_history_increment.py'
      - 'training/datasets/**/snapshots/**/source/*.zip'
      - '.github/workflows/ingest-artifacts.yml'

permissions:
  contents: write

concurrency:
  group: artifact-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test hand-history increment builder
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/datasets/test_build_hand_history_increment.py

      - name: Import and verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/inbox/*.json)
          for manifest in "${manifests[@]}"; do
            echo "Processing $manifest"
            python3 tools/ingest_dispatch.py "$manifest"
          done

      - name: Commit verified imported artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No imported artifact changes to commit.'
            exit 0
          fi
          git config user.name 'poker-engine artifact bot'
          git config user.email 'artifact-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified persisted artifacts'
          git push
