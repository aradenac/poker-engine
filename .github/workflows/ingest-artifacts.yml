name: Ingest staged artifacts

on:
  push:
    paths:
      - 'artifacts/inbox/*.json'
      - 'tools/ingest_artifact.py'
      - 'tools/ingest_dispatch.py'
      - 'tools/datasets/audit_hand_history_archive.py'
      - 'training/datasets/NLHE_100-200/**/*.zip'
      - '.github/workflows/ingest-artifacts.yml'

permissions:
  contents: write

concurrency:
  group: artifact-ingest-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import and verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/inbox/*.json)
          for manifest in "${manifests[@]}"; do
            echo "Processing $manifest"
            python3 tools/ingest_dispatch.py "$manifest"
          done

      - name: Audit NLHE hand-history archives
        shell: bash
        run: |
          set -euo pipefail
          baseline='training/datasets/NLHE_100-200/source/NLHE 100-200.zip'
          snapshot='training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'
          if [ -f "$baseline" ]; then
            python3 tools/datasets/audit_hand_history_archive.py "$baseline" \
              'training/datasets/NLHE_100-200/source/manifest.json'
          fi
          if [ -f "$snapshot" ]; then
            python3 tools/datasets/audit_hand_history_archive.py "$snapshot" \
              'training/datasets/NLHE_100-200/snapshots/20260909/manifest.json'
          fi

      - name: Commit imported artifacts and dataset manifests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No artifact changes to commit.'
            exit 0
          fi
          git config user.name 'poker-engine artifact bot'
          git config user.email 'artifact-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Import and audit persisted artifacts'
          git push
