name: Ingest staged artifacts

on:
  push:
    paths:
      - '.python-version'
      - '.node-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'artifacts/inbox/*.json'
      - 'tools/ingest_artifact.py'
      - 'tools/ingest_dispatch.py'
      - 'tests/datasets/test_build_hand_history_increment.py'
      - 'training/datasets/**/snapshots/**/source/*.zip'
      - '.github/workflows/ingest-artifacts.yml'

permissions:
  contents: write

concurrency:
  group: artifact-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Verify locked REPRO environment
        run: python3 tools/repro_ci_environment.py verify

      - name: Test hand-history increment builder
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/datasets/test_build_hand_history_increment.py

      - name: Import and verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/inbox/*.json)
          for manifest in "${manifests[@]}"; do
            echo "Processing $manifest"
            python3 tools/ingest_dispatch.py "$manifest"
          done

      - name: Commit verified imported artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No imported artifact changes to commit.'
            exit 0
          fi
          git config user.name 'poker-engine artifact bot'
          git config user.email 'artifact-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified persisted artifacts'
          git push
