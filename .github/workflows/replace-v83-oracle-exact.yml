name: Replace v83 oracle adapter exactly

on:
  push:
    paths:
      - '.github/workflows/replace-v83-oracle-exact.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact v83 adapter
        run: |
          python3 tools/simulation/_patch_v83_oracle_exact.py
          python3 -m py_compile tools/simulation/sequential_postflop.py
      - name: Remove one-shot patch files
        run: |
          rm .github/workflows/replace-v83-oracle-exact.yml
          rm tools/simulation/_patch_v83_oracle_exact.py
      - name: Commit exact adapter
        run: |
          git config user.name 'poker-engine maintenance bot'
          git config user.email 'maintenance-bot@users.noreply.github.com'
          git add tools/simulation/sequential_postflop.py
          git add -u .github/workflows/replace-v83-oracle-exact.yml tools/simulation/_patch_v83_oracle_exact.py
          git commit -m 'Use exact v83 review alternatives in sequential oracle'
          git push
