name: NLHE 100-200 user artifact bundle

on:
  pull_request:
    paths:
      - 'user/artifacts/NLHE_100-200/**'
      - 'tools/build_user_artifact_bundle.py'
      - 'training/runs/20260912_population_increment_cycle/FINAL_STATE.json'
      - 'training/models/preflop_population_model_v5.json'
      - 'training/models/postflop_population_model_v5.json'
      - 'training/registry.json'
      - '.github/workflows/user-artifact-bundle.yml'
  push:
    branches:
      - main
    paths:
      - 'user/artifacts/NLHE_100-200/**'
      - 'tools/build_user_artifact_bundle.py'
      - 'training/runs/20260912_population_increment_cycle/FINAL_STATE.json'
      - 'training/models/preflop_population_model_v5.json'
      - 'training/models/postflop_population_model_v5.json'
      - 'training/registry.json'
      - '.github/workflows/user-artifact-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro-environment:
    uses: ./.github/workflows/repro-scientific-environment.yml

  build-and-verify:
    needs: repro-environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Enforce locked REPRO identity
        env:
          REPRO_ENVIRONMENT_IDENTITY_SHA256: ${{ needs.repro-environment.outputs.environment_identity_sha256 }}
        run: |
          set -euo pipefail
          python3 tools/repro_ci_environment.py verify > /tmp/repro-ci-environment.json
          python3 tools/repro_ci_environment.py identity --output /tmp/repro-environment-identity.json
          python3 - <<'PY'
          import json, os
          value=json.load(open('/tmp/repro-environment-identity.json', encoding='utf-8'))
          expected=os.environ['REPRO_ENVIRONMENT_IDENTITY_SHA256']
          assert value['identity_sha256']==expected, (value['identity_sha256'], expected)
          PY

      - name: Build bundle twice from the same commit
        env:
          BUNDLE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rm -rf /tmp/bundle-a /tmp/bundle-b
          python3 tools/build_user_artifact_bundle.py --out-dir /tmp/bundle-a
          python3 tools/build_user_artifact_bundle.py --out-dir /tmp/bundle-b
          A="$(find /tmp/bundle-a -maxdepth 1 -name '*.zip' -type f -print -quit)"
          B="$(find /tmp/bundle-b -maxdepth 1 -name '*.zip' -type f -print -quit)"
          test -n "$A" && test -n "$B"
          cmp "$A" "$B"
          sha256sum "$A"

      - name: Validate archive contents, manifest and checksums
        run: |
          ZIP="$(find /tmp/bundle-a -maxdepth 1 -name '*.zip' -type f -print -quit)"
          rm -rf /tmp/bundle-check
          mkdir -p /tmp/bundle-check
          unzip -q "$ZIP" -d /tmp/bundle-check
          ROOT="$(find /tmp/bundle-check -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$ROOT/custom.json"
          test -f "$ROOT/preflop_population_model_v5.json"
          test -f "$ROOT/postflop_population_model_v5.json"
          test -f "$ROOT/MANIFEST.json"
          test -f "$ROOT/README.md"
          test -f "$ROOT/CHECKSUMS.sha256"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)
          python3 - "$ROOT/MANIFEST.json" <<'PY'
          import json, sys
          m=json.load(open(sys.argv[1], encoding='utf-8'))
          assert m['schema']=='poker-user-artifact-bundle/v1'
          assert m['population']=='NLHE 100-200'
          assert m['coherency']=='inseparable_set'
          assert {x['role'] for x in m['artifacts']} == {'custom_ranges','preflop_population','postflop_population'}
          assert m['training_state']['gate_status']=='PASS'
          assert m['release']['immutable'] is True
          PY

      - name: Stage downloadable artifact
        run: |
          mkdir -p dist
          cp /tmp/bundle-a/*.zip dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nlhe-100-200-user-artifacts-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
