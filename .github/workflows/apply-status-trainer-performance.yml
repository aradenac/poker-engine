name: Apply trainer performance status

on:
  push:
    branches: [docs-trainer-performance-status]
    paths:
      - '.github/workflows/apply-status-trainer-performance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest branch head
        run: git pull --rebase origin docs-trainer-performance-status
      - name: Apply status patch
        run: python3 tools/patches/patch_status_trainer_performance.py
      - name: Validate status
        run: |
          grep -q '## Trainer performance optimization' .project/STATUS.md
          grep -q 'ce77ca4de84dc37f4177e2c4412ad905dc7b45dd' .project/STATUS.md
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-status-trainer-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .project/STATUS.md .github/workflows/apply-status-trainer-performance.yml
          git commit -m 'Record completed trainer performance optimization'
          git push origin HEAD:docs-trainer-performance-status
