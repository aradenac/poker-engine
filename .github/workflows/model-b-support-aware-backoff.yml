name: Model B support-aware hierarchical backoff

on:
  workflow_dispatch:
  push:
    branches:
      - agent-B/issue-286-support-aware-backoff
    paths:
      - 'tools/simulation/model_b_support_aware_backoff.py'
      - 'tools/training/independent_profiles/evaluate_support_aware_backoff_v1.py'
      - 'tests/simulation/test_model_b_support_aware_backoff.py'
      - 'tests/training/test_support_aware_backoff_v1.py'
      - 'training/runs/20260919_model_b_support_aware_backoff_v1/PROTOCOL.json'
      - 'training/runs/20260919_model_b_support_aware_backoff_v1/BACKOFF_GRAPH.json'
      - '.github/workflows/model-b-support-aware-backoff.yml'

permissions:
  contents: write

concurrency:
  group: model-b-support-aware-backoff-issue-286
  cancel-in-progress: true

env:
  POPULATION: legacy_pokerstars_nlhe_100-200_play_6max_mixed_v1
  RUN_DIR: training/runs/20260919_model_b_support_aware_backoff_v1
  SOURCE197: training/runs/20260919_model_b_response_to_price_v1
  SOURCE272: training/runs/20260919_model_b_observed_vs_simulated_calibration_v1
  INCUMBENT: training/runs/20260912_independent_profiles_v2/model
  ARCHIVE_1: training/datasets/NLHE_100-200/source/NLHE 100-200.zip
  ARCHIVE_2: training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip
  ARCHIVE_3: training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard frozen protocol and TEST isolation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("training/runs/20260919_model_b_support_aware_backoff_v1")
          p=json.loads((root/"PROTOCOL.json").read_text())
          g=json.loads((root/"BACKOFF_GRAPH.json").read_text())
          assert p["status"]=="FROZEN_BEFORE_VALIDATION"
          assert p["split_contract"]["fit"]==["TRAIN"]
          assert p["split_contract"]["evaluate"]==["VALIDATION"]
          assert p["split_contract"]["forbidden"]==["TEST"]
          assert p["split_contract"]["test_consumed"] is False
          assert p["scientific_constraints"]["hyperparameters_selected_on_validation"] is False
          assert p["scientific_constraints"]["automatic_promotion"] is False
          assert p["scientific_constraints"]["active_model_b_change_allowed"] is False
          assert p["scientific_constraints"]["production_effect"]=="NONE"
          assert g["source_split"]=="TRAIN"
          assert g["frozen_before_validation"] is True
          assert g["nearest_context_heuristic"] is False

          r197=json.loads(Path("$SOURCE197/RESULT.json").read_text())
          p272=json.loads(Path("$SOURCE272/PROTOCOL.json").read_text())
          assert r197["test_consumed"] is False
          assert r197["production_effect"]=="NONE"
          assert p272["split_contract"]["test_consumed"] is False
          print("frozen protocol / TEST isolation: PASS")
          PY

      - name: Compile and run issue 286 unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile             tools/simulation/model_b_support_aware_backoff.py             tools/training/independent_profiles/evaluate_support_aware_backoff_v1.py             tests/simulation/test_model_b_support_aware_backoff.py             tests/training/test_support_aware_backoff_v1.py
          PYTHONPATH=. python3 tests/simulation/test_model_b_support_aware_backoff.py
          PYTHONPATH=. python3 tests/training/test_support_aware_backoff_v1.py

      - name: Run frozen VALIDATION analysis twice
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR/.rerun-a" "$RUN_DIR/.rerun-b"
          for out in "$RUN_DIR/.rerun-a" "$RUN_DIR/.rerun-b"; do
            PYTHONPATH=. python3 -m tools.training.independent_profiles.evaluate_support_aware_backoff_v1               --archive "$ARCHIVE_1"               --archive "$ARCHIVE_2"               --archive "$ARCHIVE_3"               --stake 100/200               --exclude-player RoiDePiqueNique               --incumbent-model-dir "$INCUMBENT"               --candidate197-artifact "$SOURCE197/model/response_to_price.json"               --source197-protocol "$SOURCE197/PROTOCOL.json"               --source197-result "$SOURCE197/RESULT.json"               --protocol "$RUN_DIR/PROTOCOL.json"               --graph "$RUN_DIR/BACKOFF_GRAPH.json"               --population-id "$POPULATION"               --output-dir "$out"               --bootstrap-samples 1000
          done
          for f in model/support_aware_backoff.json TRAIN_FIT_AUDIT.json REPORT.json SUMMARY.json RESULT.json; do
            cmp "$RUN_DIR/.rerun-a/$f" "$RUN_DIR/.rerun-b/$f"
          done
          echo "deterministic rerun: PASS"

      - name: Persist deterministic evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/model"
          cp "$RUN_DIR/.rerun-a/model/support_aware_backoff.json" "$RUN_DIR/model/support_aware_backoff.json"
          cp "$RUN_DIR/.rerun-a/TRAIN_FIT_AUDIT.json" "$RUN_DIR/TRAIN_FIT_AUDIT.json"
          cp "$RUN_DIR/.rerun-a/REPORT.json" "$RUN_DIR/REPORT.json"
          cp "$RUN_DIR/.rerun-a/SUMMARY.json" "$RUN_DIR/SUMMARY.json"
          cp "$RUN_DIR/.rerun-a/RESULT.json" "$RUN_DIR/RESULT.json"
          rm -rf "$RUN_DIR/.rerun-a" "$RUN_DIR/.rerun-b"

      - name: Final scientific and lane-safety guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("training/runs/20260919_model_b_support_aware_backoff_v1")
          r=json.loads((root/"REPORT.json").read_text())
          s=json.loads((root/"SUMMARY.json").read_text())
          f=json.loads((root/"RESULT.json").read_text())
          a=json.loads((root/"TRAIN_FIT_AUDIT.json").read_text())
          m=json.loads((root/"model/support_aware_backoff.json").read_text())
          assert r["schema"]=="model-b-support-aware-backoff-validation/v1"
          assert r["status"]=="COMPLETE"
          assert r["dataset"]["fit_split"]=="TRAIN"
          assert r["dataset"]["evaluation_split"]=="VALIDATION"
          assert r["dataset"]["test_consumed"] is False
          assert r["comparability"]["same_validation_rows_all_models"] is True
          assert r["comparability"]["same_public_context_set_all_models"] is True
          assert r["comparability"]["silent_pooling"] is False
          assert r["source_counts"]["prediction_rows"]==r["source_counts"]["validation_facing_decisions"]
          assert r["source_counts"]["sum_context_validation_observations"]==r["source_counts"]["validation_facing_decisions"]
          assert r["feature_safety"]["model_a_recommendation_or_ev_consumed"] is False
          assert r["test_consumed"] is False
          assert r["production_effect"]=="NONE"
          assert r["automatic_promotion"] is False
          assert r["active_model_b_changed"] is False
          assert s["test_consumed"] is False and s["production_effect"]=="NONE"
          assert a["fit_split"]=="TRAIN" and a["validation_used_for_selection"] is False
          assert m["fit_split"]=="TRAIN" and m["test_consumed"] is False
          assert all(f["dod"].values())
          assert f["test_consumed"] is False and f["production_effect"]=="NONE"
          assert any(p["support_aware"]["fallback_reason"]=="EXACT_CONTEXT_SUPPORTED" for p in r["predictions"])
          assert any(p["support_aware"]["selected_level"]["index"]>0 for p in r["predictions"])
          print(json.dumps({
            "dataset":r["dataset"],
            "global":s["global"],
            "fallback":s["fallback"],
            "domain_counts":s["domain_comparison_counts_vs_candidate197"],
            "artifact_sha256":r["support_aware_identity"]["artifact_sha256"],
            "test_consumed":False,
            "production_effect":"NONE",
          },indent=2))
          PY
          changed="$(git diff --name-only HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)(hero-pfpc|107|108|holdout)|training/registry\.json|training/populations/|site/index\.html|site/trainer\.js'; then
            echo "forbidden cross-lane/production modification detected" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: issue-286-model-b-support-aware-backoff
          path: |
            training/runs/20260919_model_b_support_aware_backoff_v1/PROTOCOL.json
            training/runs/20260919_model_b_support_aware_backoff_v1/BACKOFF_GRAPH.json
            training/runs/20260919_model_b_support_aware_backoff_v1/model/support_aware_backoff.json
            training/runs/20260919_model_b_support_aware_backoff_v1/TRAIN_FIT_AUDIT.json
            training/runs/20260919_model_b_support_aware_backoff_v1/REPORT.json
            training/runs/20260919_model_b_support_aware_backoff_v1/SUMMARY.json
            training/runs/20260919_model_b_support_aware_backoff_v1/RESULT.json

      - name: Commit persisted issue 286 evidence to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR/model/support_aware_backoff.json"                   "$RUN_DIR/TRAIN_FIT_AUDIT.json"                   "$RUN_DIR/REPORT.json"                   "$RUN_DIR/SUMMARY.json"                   "$RUN_DIR/RESULT.json"
          if git diff --cached --quiet; then
            echo "No issue #286 evidence changes to commit"
          else
            git commit -m "[B][#286] Persist support-aware Model B evidence"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
