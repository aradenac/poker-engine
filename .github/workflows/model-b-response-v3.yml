name: Model B response-conditioned v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/training/independent_profiles/build_model_b.py'
      - 'tools/training/independent_profiles/conditioned_response_candidate.py'
      - 'tools/training/independent_profiles/audit_response_conditioning.py'
      - 'tests/independent_profiles/test_conditioned_response_candidate.py'
      - 'tests/independent_profiles/test_french_button_position.py'
      - '.github/workflows/model-b-response-v3.yml'

permissions:
  contents: write

concurrency:
  group: model-b-response-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile and unit test
        run: |
          python3 -m py_compile tools/training/independent_profiles/conditioned_response_candidate.py tools/training/independent_profiles/build_model_b.py
          python3 tests/independent_profiles/test_conditioned_response_candidate.py
          python3 tests/independent_profiles/test_french_button_position.py

      - name: Build and select response-conditioned representation
        run: |
          rm -rf training/runs/20260913_model_b_response_v3
          python3 -m tools.training.independent_profiles.conditioned_response_candidate \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --archive 'training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip' \
            --stake '100/200' \
            --exclude-player 'RoiDePiqueNique' \
            --incumbent-model-dir 'training/runs/20260912_independent_profiles_v2/model' \
            --output-dir 'training/runs/20260913_model_b_response_v3'

      - name: Validate complete position coverage
        run: |
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          from tools.datasets.build_hand_history_increment import split_for
          from tools.training.independent_profiles.build_model_b import parse_hand
          from tools.training.independent_profiles.build_player_features import merge_archives

          archives=[
            Path('training/datasets/NLHE_100-200/source/NLHE 100-200.zip'),
            Path('training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'),
            Path('training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip'),
          ]
          records, provenance=merge_archives(archives, {'100/200'})
          rows=[]
          for hid, record in records.items():
              hand=parse_hand(record)
              assert hand is not None
              positions=hand.get('positions') or {}
              rows.append({
                'split':split_for(hid),
                'language':record.language,
                'button_missing':hand.get('button') is None,
                'all_positions_na':bool(positions) and all(v=='NA' for v in positions.values()),
              })
          def summary(xs):
              return {
                'hands':len(xs),
                'languages':dict(sorted(collections.Counter(x['language'] for x in xs).items())),
                'button_missing':sum(x['button_missing'] for x in xs),
                'all_positions_na':sum(x['all_positions_na'] for x in xs),
              }
          report={
            'schema':'model-b-french-position-audit/v1',
            'status':'PASS_AFTER_FIX',
            'defect_before_fix':{
              'full_corpus_french_hands':994,
              'full_corpus_button_missing':994,
              'train_french_hands':803,
              'validation_french_hands':90,
              'test_french_hands':101
            },
            'dataset_provenance':provenance,
            'after_fix':{
              'full_corpus':summary(rows),
              'by_split':{s:summary([x for x in rows if x['split']==s]) for s in ('TRAIN','VALIDATION','TEST')},
            },
            'production_effect':'NONE'
          }
          assert report['after_fix']['full_corpus']['hands']==31003
          assert report['after_fix']['full_corpus']['button_missing']==0, report
          assert report['after_fix']['full_corpus']['all_positions_na']==0, report
          out=Path('training/runs/20260913_model_b_response_v3/french_position_audit.json')
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          PY

      - name: Validate selection protocol
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('training/runs/20260913_model_b_response_v3/selection.json')
          d = json.loads(p.read_text())
          assert d['dataset']['unique_scoped_hands'] == 31003
          assert d['dataset']['split_counts'] == {'TRAIN': 24755, 'VALIDATION': 3073, 'TEST': 3175}
          assert d['train_hands'] == 24755
          assert d['selection_policy']['model_selection_split'] == 'VALIDATION'
          assert d['selection_policy']['test_used_for_selection'] is False
          assert d['production_effect'] == 'NONE'
          assert 'no Model A outputs' in d['independence_contract']
          assert d['strength_conditioning']['status'] == 'withheld_revealed_selection_bias'
          audit=json.loads(Path('training/runs/20260913_model_b_response_v3/french_position_audit.json').read_text())
          assert audit['status']=='PASS_AFTER_FIX'
          assert audit['after_fix']['full_corpus']['button_missing']==0
          assert audit['after_fix']['full_corpus']['all_positions_na']==0
          if d['selected_variant'] is None:
              assert d['test_locked_confirmation'] is None
              assert d['decision'] == 'RETAIN_INCUMBENT'
          else:
              assert d['selected_variant'] in d['variants']
              assert d['variants'][d['selected_variant']]['gate']['pass'] is True
              assert d['test_locked_confirmation'] is not None
              model = Path('training/runs/20260913_model_b_response_v3/selected_candidate/model')
              assert (model / 'postflop_actions.json').exists()
              assert (model / 'sizing.json').exists()
          PY

      - name: Persist deterministic v3 evidence
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- training/runs/20260913_model_b_response_v3)" ]; then
            echo 'Response-v3 evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training/runs/20260913_model_b_response_v3
          git commit -m 'Persist Model B v3 response-conditioning evidence'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
