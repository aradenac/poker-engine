name: Validate preflop action sizing search

on:
  push:
    paths:
      - 'src/preflop/contract.js'
      - 'src/preflop/decision.js'
      - 'src/preflop/search.js'
      - 'src/preflop/hero_range_export.js'
      - 'tests/preflop/test_decision_contract.js'
      - 'tests/preflop/test_search.js'
      - 'tests/hero_ranges/test_calculated_range_export.mjs'
      - 'docs/preflop-search-orchestrator.md'
      - '.github/workflows/preflop-search.yml'
  pull_request:
    paths:
      - 'src/preflop/contract.js'
      - 'src/preflop/decision.js'
      - 'src/preflop/search.js'
      - 'src/preflop/hero_range_export.js'
      - 'tests/preflop/test_decision_contract.js'
      - 'tests/preflop/test_search.js'
      - 'tests/hero_ranges/test_calculated_range_export.mjs'
      - 'docs/preflop-search-orchestrator.md'
      - '.github/workflows/preflop-search.yml'

permissions:
  contents: read

concurrency:
  group: preflop-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/preflop/search.js
          node --check tests/preflop/test_search.js
      - name: Existing preflop decision contract
        run: node tests/preflop/test_decision_contract.js
      - name: Action and sizing search regressions
        run: node tests/preflop/test_search.js
      - name: Calculated range export remains compatible
        run: node tests/hero_ranges/test_calculated_range_export.mjs
