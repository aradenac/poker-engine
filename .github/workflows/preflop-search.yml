name: Validate preflop action sizing search

on:
  push:
    paths:
      - '.python-version'
      - '.node-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'src/preflop/contract.js'
      - 'src/preflop/decision.js'
      - 'src/preflop/search.js'
      - 'src/preflop/hero_range_export.js'
      - 'tests/preflop/test_decision_contract.js'
      - 'tests/preflop/test_search.js'
      - 'tests/hero_ranges/test_calculated_range_export.mjs'
      - 'docs/preflop-search-orchestrator.md'
      - '.github/workflows/preflop-search.yml'
      - '.github/actions/repro-runtime/action.yml'
  pull_request:
    paths:
      - '.python-version'
      - '.node-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'src/preflop/contract.js'
      - 'src/preflop/decision.js'
      - 'src/preflop/search.js'
      - 'src/preflop/hero_range_export.js'
      - 'tests/preflop/test_decision_contract.js'
      - 'tests/preflop/test_search.js'
      - 'tests/hero_ranges/test_calculated_range_export.mjs'
      - 'docs/preflop-search-orchestrator.md'
      - '.github/workflows/preflop-search.yml'
      - '.github/actions/repro-runtime/action.yml'

permissions:
  contents: read

concurrency:
  group: preflop-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/repro-runtime
        with:
          require-node: 'false'
          install-python-deps: 'true'
        with:
          require-node: 'true'
      - name: Syntax
        run: |
          node --check src/preflop/search.js
          node --check tests/preflop/test_search.js
      - name: Existing preflop decision contract
        run: node tests/preflop/test_decision_contract.js
      - name: Action and sizing search regressions
        run: node tests/preflop/test_search.js
      - name: Calculated range export remains compatible
        run: node tests/hero_ranges/test_calculated_range_export.mjs
