name: Model B aggressive-tail calibration

on:
  workflow_dispatch:
  push:
    branches:
      - agent-B/issue-298-aggressive-tail-calibration
    paths:
      - 'tools/simulation/model_b_aggressive_tail.py'
      - 'tools/training/independent_profiles/evaluate_aggressive_tail_v1.py'
      - 'tests/simulation/test_model_b_aggressive_tail.py'
      - 'tests/training/test_aggressive_tail_v1.py'
      - 'training/runs/20260919_model_b_aggressive_tail_v1/PROTOCOL.json'
      - 'training/runs/20260919_model_b_aggressive_tail_v1/TAIL_GRAPH.json'
      - '.github/workflows/model-b-aggressive-tail.yml'

permissions:
  contents: write

concurrency:
  group: model-b-aggressive-tail-issue-298
  cancel-in-progress: true

env:
  POPULATION: legacy_pokerstars_nlhe_100-200_play_6max_mixed_v1
  RUN_DIR: training/runs/20260919_model_b_aggressive_tail_v1
  SOURCE197: training/runs/20260919_model_b_response_to_price_v1
  SOURCE286: training/runs/20260919_model_b_support_aware_backoff_v1
  INCUMBENT: training/runs/20260912_independent_profiles_v2/model
  ARCHIVE_1: training/datasets/NLHE_100-200/source/NLHE 100-200.zip
  ARCHIVE_2: training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip
  ARCHIVE_3: training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard frozen protocol and TEST isolation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUN_DIR"])
          p=json.loads((root/"PROTOCOL.json").read_text())
          g=json.loads((root/"TAIL_GRAPH.json").read_text())
          assert p["status"]=="FROZEN_BEFORE_VALIDATION"
          assert p["split_contract"]["fit"]==["TRAIN"]
          assert p["split_contract"]["evaluate"]==["VALIDATION"]
          assert p["split_contract"]["forbidden"]==["TEST"]
          assert p["split_contract"]["test_consumed"] is False
          assert p["method"]["tail_min_raises"]==12
          assert p["method"]["tail_min_distinct_hands"]==8
          assert p["method"]["alpha_per_tail_class"]==0.5
          assert p["scientific_constraints"]["hyperparameters_selected_on_validation"] is False
          assert p["scientific_constraints"]["automatic_promotion"] is False
          assert p["scientific_constraints"]["active_model_b_change_allowed"] is False
          assert p["scientific_constraints"]["production_effect"]=="NONE"
          assert g["source_split"]=="TRAIN"
          assert g["frozen_before_validation"] is True
          assert g["nearest_context_heuristic"] is False
          assert g["silent_pooling"] is False

          r197=json.loads((Path(os.environ["SOURCE197"])/"RESULT.json").read_text())
          r286=json.loads((Path(os.environ["SOURCE286"])/"RESULT.json").read_text())
          assert r197["test_consumed"] is False
          assert r286["test_consumed"] is False
          assert r286["active_model_b_changed"] is False
          print("frozen #298 protocol / TEST isolation: PASS")
          PY

      - name: Compile and run issue 298 unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile             tools/simulation/model_b_aggressive_tail.py             tools/training/independent_profiles/evaluate_aggressive_tail_v1.py             tests/simulation/test_model_b_aggressive_tail.py             tests/training/test_aggressive_tail_v1.py
          PYTHONPATH=. python3 tests/simulation/test_model_b_aggressive_tail.py
          PYTHONPATH=. python3 tests/training/test_aggressive_tail_v1.py

      - name: Run frozen VALIDATION analysis twice
        run: |
          set -euo pipefail
          rm -rf "$RUN_DIR/.rerun-a" "$RUN_DIR/.rerun-b"
          for out in "$RUN_DIR/.rerun-a" "$RUN_DIR/.rerun-b"; do
            PYTHONPATH=. python3 -m tools.training.independent_profiles.evaluate_aggressive_tail_v1               --archive "$ARCHIVE_1"               --archive "$ARCHIVE_2"               --archive "$ARCHIVE_3"               --stake 100/200               --exclude-player RoiDePiqueNique               --incumbent-model-dir "$INCUMBENT"               --candidate197-artifact "$SOURCE197/model/response_to_price.json"               --candidate286-artifact "$SOURCE286/model/support_aware_backoff.json"               --source197-protocol "$SOURCE197/PROTOCOL.json"               --source197-result "$SOURCE197/RESULT.json"               --source286-result "$SOURCE286/RESULT.json"               --protocol "$RUN_DIR/PROTOCOL.json"               --graph "$RUN_DIR/TAIL_GRAPH.json"               --population-id "$POPULATION"               --output-dir "$out"               --bootstrap-samples 1000
          done
          for f in model/aggressive_tail.json TRAIN_FIT_AUDIT.json REPORT.json SUMMARY.json RESULT.json; do
            cmp "$RUN_DIR/.rerun-a/$f" "$RUN_DIR/.rerun-b/$f"
          done
          echo "deterministic rerun: PASS"

      - name: Persist deterministic evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/model"
          cp "$RUN_DIR/.rerun-a/model/aggressive_tail.json" "$RUN_DIR/model/aggressive_tail.json"
          cp "$RUN_DIR/.rerun-a/TRAIN_FIT_AUDIT.json" "$RUN_DIR/TRAIN_FIT_AUDIT.json"
          cp "$RUN_DIR/.rerun-a/REPORT.json" "$RUN_DIR/REPORT.json"
          cp "$RUN_DIR/.rerun-a/SUMMARY.json" "$RUN_DIR/SUMMARY.json"
          cp "$RUN_DIR/.rerun-a/RESULT.json" "$RUN_DIR/RESULT.json"
          rm -rf "$RUN_DIR/.rerun-a" "$RUN_DIR/.rerun-b"

      - name: Final scientific and lane-safety guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUN_DIR"])
          r=json.loads((root/"REPORT.json").read_text())
          s=json.loads((root/"SUMMARY.json").read_text())
          f=json.loads((root/"RESULT.json").read_text())
          a=json.loads((root/"TRAIN_FIT_AUDIT.json").read_text())
          m=json.loads((root/"model/aggressive_tail.json").read_text())
          assert r["schema"]=="model-b-aggressive-tail-validation/v1"
          assert r["status"]=="COMPLETE"
          assert r["dataset"]["fit_split"]=="TRAIN"
          assert r["dataset"]["evaluation_split"]=="VALIDATION"
          assert r["dataset"]["test_consumed"] is False
          assert r["comparability"]["same_validation_rows_all_models"] is True
          assert r["comparability"]["same_public_context_set_all_models"] is True
          assert r["global"]["action_guard_equal_to_286"] is True
          assert r["global"]["sizing_guard_equal_to_286"] is True
          assert set(r["global"]["tail_calibration"]["tail298"]["metrics"])=={"jam","overbet","aggressive_tail"}
          assert r["global"]["descriptive_gate"] in {
            "TAIL_IMPROVEMENT_WITHOUT_GLOBAL_DEGRADATION",
            "GLOBAL_TAIL_TRADEOFF",
            "NO_GAIN",
            "INSUFFICIENT_SUPPORT",
          }
          assert r["test_consumed"] is False
          assert r["production_effect"]=="NONE"
          assert r["automatic_promotion"] is False
          assert r["active_model_b_changed"] is False
          assert r["feature_safety"]["model_a_or_hero_or_ev_consumed"] is False
          assert a["fit_split"]=="TRAIN"
          assert a["validation_used_for_selection"] is False
          assert m["fit_split"]=="TRAIN"
          assert m["test_consumed"] is False
          assert m["production_effect"]=="NONE"
          assert all(f["dod"].values())
          assert f["test_consumed"] is False
          assert f["production_effect"]=="NONE"
          assert f["active_model_b_changed"] is False
          assert s["test_consumed"] is False
          assert s["production_effect"]=="NONE"
          print(json.dumps({
            "dataset":r["dataset"],
            "gate":r["global"]["descriptive_gate"],
            "action":s["action_calibration"],
            "sizing":s["sizing_calibration"],
            "tails":s["tail_calibration"],
            "uncertainty":s["tail298_vs_286_uncertainty"],
            "coverage":s["tail298_selection_coverage"],
            "domain_counts":s["domain_comparison_counts_vs_286"],
            "tail_artifact_sha256":r["identities"]["tail298"]["artifact_sha256"],
            "test_consumed":False,
            "production_effect":"NONE",
          },indent=2))
          PY
          changed="$(git diff --name-only HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)(hero-pfpc|107|108|holdout)|training/registry\.json|training/populations/|site/index\.html|site/trainer\.js'; then
            echo "forbidden cross-lane/production modification detected" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: issue-298-model-b-aggressive-tail
          path: |
            training/runs/20260919_model_b_aggressive_tail_v1/PROTOCOL.json
            training/runs/20260919_model_b_aggressive_tail_v1/TAIL_GRAPH.json
            training/runs/20260919_model_b_aggressive_tail_v1/model/aggressive_tail.json
            training/runs/20260919_model_b_aggressive_tail_v1/TRAIN_FIT_AUDIT.json
            training/runs/20260919_model_b_aggressive_tail_v1/REPORT.json
            training/runs/20260919_model_b_aggressive_tail_v1/SUMMARY.json
            training/runs/20260919_model_b_aggressive_tail_v1/RESULT.json

      - name: Commit persisted issue 298 evidence to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR/model/aggressive_tail.json"                   "$RUN_DIR/TRAIN_FIT_AUDIT.json"                   "$RUN_DIR/REPORT.json"                   "$RUN_DIR/SUMMARY.json"                   "$RUN_DIR/RESULT.json"
          if git diff --cached --quiet; then
            echo "No issue #298 evidence changes to commit"
          else
            git commit -m "[B][#298] Persist aggressive-tail scientific evidence"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
