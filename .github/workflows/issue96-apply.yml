name: Issue 96 one-shot integration

on:
  push:
    branches: [issue-96-preflop-contract]
    paths:
      - tools/tmp_issue96_apply.py
      - .github/workflows/issue96-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-96-preflop-contract
          fetch-depth: 0
      - name: Apply deterministic integration
        run: python3 tools/tmp_issue96_apply.py
      - name: Check syntax and shared contract
        run: |
          python3 -m py_compile tools/preflop/context_contract.py tools/training/increment_decisions.py tools/training/audit_preflop_key_runtime_parity.py
          node --check site/preflop-contract.js
          node --check <(python3 - <<'PY'
          from pathlib import Path
          s=Path('site/index.html').read_text()
          a=s.index('<script src="./preflop-contract.js"></script>')
          b=s.index('<script>',a)
          c=s.index('</script>',b)
          print(s[b+8:c])
          PY
          )
          python3 tests/preflop/test_context_contract.py
          python3 tests/training/test_preflop_key_runtime_parity.py
      - name: Refresh and verify release identity
        run: |
          python3 tools/write_site_release.py
          python3 tools/write_site_release.py --check
      - name: Commit durable integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Issue #96: integrate canonical preflop contract"
          git push origin HEAD:issue-96-preflop-contract
