name: Apply trainer guided consistency

on:
  push:
    branches: [issue-30-guided-verdict-consistency]
    paths:
      - 'tools/patches/fix_trainer_guided_consistency.py'
      - '.github/workflows/apply-trainer-guided-consistency.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-30-guided-verdict-consistency
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/patches/fix_trainer_guided_consistency.py
      - name: Validate syntax and trainer contracts
        run: |
          node --check site/trainer.js
          for t in tests/trainer/test_*.py; do python3 "$t"; done
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-trainer-guided-consistency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Guided recommendation verdict consistency'
          git push origin HEAD:issue-30-guided-verdict-consistency
