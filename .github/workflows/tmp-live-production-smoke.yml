name: Temporary live production identity

on:
  push:
    branches:
      - issue-45-live-production-smoke
    paths:
      - '.github/workflows/tmp-live-production-smoke.yml'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://poker-engine.arad-chatgpt-compositeur-repas.workers.dev
      VERSION_URL: https://56cd6e46-poker-engine.arad-chatgpt-compositeur-repas.workers.dev
      EXPECTED_COMMIT: 5f8b836060ea016c359c8a859db9a7b35e0b2ed6
      EXPECTED_BUILD: fb09ab55-8b92-409a-9835-da3d432ae748
      EXPECTED_VERSION: 56cd6e46-214a-4ee0-b99d-9815487ca765
    steps:
      - uses: actions/checkout@v4
      - name: Tie production hostname to exact version and source commit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --connect-timeout 10 "$PROD_URL/" -o /tmp/prod.html
          curl -fsS --retry 3 --connect-timeout 10 "$VERSION_URL/" -o /tmp/version.html
          curl -fsS --retry 3 --connect-timeout 10 "$PROD_URL/deployment-meta.css" -o /tmp/prod-meta.css
          curl -fsS --retry 3 --connect-timeout 10 "$VERSION_URL/deployment-meta.css" -o /tmp/version-meta.css
          prod_sha="$(sha256sum /tmp/prod.html | awk '{print $1}')"
          version_sha="$(sha256sum /tmp/version.html | awk '{print $1}')"
          meta_prod_sha="$(sha256sum /tmp/prod-meta.css | awk '{print $1}')"
          meta_version_sha="$(sha256sum /tmp/version-meta.css | awk '{print $1}')"
          test "$prod_sha" = "$version_sha"
          test "$meta_prod_sha" = "$meta_version_sha"
          grep -F "commit: $EXPECTED_COMMIT" /tmp/prod-meta.css
          grep -F 'branch: main' /tmp/prod-meta.css
          grep -F "build_id: $EXPECTED_BUILD" /tmp/prod-meta.css
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          prod=Path('/tmp/prod.html').read_bytes()
          version=Path('/tmp/version.html').read_bytes()
          meta=Path('/tmp/prod-meta.css').read_text(encoding='utf-8')
          fields={}
          for name in ('commit','branch','build_id','generated_at'):
              m=re.search(rf'^\s*{name}:\s*(.+?)\s*$',meta,re.M)
              fields[name]=m.group(1) if m else None
          evidence={
              'schema':'poker-live-deployment-identity-smoke/v1',
              'production_url':os.environ['PROD_URL'],
              'version_url':os.environ['VERSION_URL'],
              'cloudflare_version_id':os.environ['EXPECTED_VERSION'],
              'expected_commit':os.environ['EXPECTED_COMMIT'],
              'expected_build_id':os.environ['EXPECTED_BUILD'],
              'production_root_sha256':hashlib.sha256(prod).hexdigest(),
              'version_root_sha256':hashlib.sha256(version).hexdigest(),
              'production_equals_version':prod==version,
              'deployment_metadata':fields,
              'title_ok':b'Poker Range Equity' in prod and b'Offline v83' in prod,
          }
          assert evidence['production_equals_version'], evidence
          assert fields['commit']==os.environ['EXPECTED_COMMIT'], evidence
          assert fields['branch']=='main', evidence
          assert fields['build_id']==os.environ['EXPECTED_BUILD'], evidence
          assert evidence['title_ok'], evidence
          print(json.dumps(evidence,indent=2,sort_keys=True))
          Path('/tmp/live-deployment-identity.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-production-identity-${{ github.sha }}
          path: |
            /tmp/live-deployment-identity.json
            /tmp/prod-meta.css
          if-no-files-found: error
