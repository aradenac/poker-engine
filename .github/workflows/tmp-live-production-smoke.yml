name: Temporary live production smoke

on:
  push:
    branches:
      - issue-45-live-production-smoke
    paths:
      - '.github/workflows/tmp-live-production-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_URL: https://poker-engine.arad-chatgpt-compositeur-repas.workers.dev
      VERSION_URL: https://56cd6e46-poker-engine.arad-chatgpt-compositeur-repas.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Probe inferred production and version URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, urllib.error, urllib.request
          urls=[('production',os.environ['PROD_URL']),('version',os.environ['VERSION_URL'])]
          result={}
          for name,base in urls:
              try:
                  req=urllib.request.Request(base+'/', headers={'User-Agent':'poker-engine-live-smoke/1'})
                  with urllib.request.urlopen(req, timeout=20, context=ssl.create_default_context()) as r:
                      body=r.read(2_000_000).decode('utf-8','replace')
                      result[name]={
                          'url':base,
                          'status':r.status,
                          'final_url':r.geturl(),
                          'content_type':r.headers.get('content-type'),
                          'bytes':len(body.encode('utf-8')),
                          'has_app_marker':'Poker Range Equity' in body,
                          'has_trainer_marker':('trainer' in body.lower() and 'training' in body.lower()) or 'Training' in body,
                          'title_fragment': body.split('<title>',1)[1].split('</title>',1)[0] if '<title>' in body and '</title>' in body else None,
                      }
              except Exception as e:
                  result[name]={'url':base,'error':f'{type(e).__name__}: {e}'}
          print(json.dumps(result,indent=2,sort_keys=True))
          open('/tmp/url-probe.json','w',encoding='utf-8').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          if not any(v.get('status')==200 and v.get('has_app_marker') for v in result.values()):
              raise SystemExit('neither inferred public URL served the intended application')
          PY

      - name: Select verified public URL
        id: select
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('/tmp/url-probe.json'))
          for key in ('production','version'):
              v=r[key]
              if v.get('status')==200 and v.get('has_app_marker'):
                  print('url='+v['final_url'].rstrip('/'))
                  print('kind='+key)
                  raise SystemExit(0)
          raise SystemExit(1)
          PY

      - name: Verify release metadata and all trainer assets
        env:
          BASE_URL: ${{ steps.select.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --connect-timeout 10 "$BASE_URL/RELEASE.json" -o /tmp/live-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/live-release.json'))
          assert r['application']=='Poker Range Equity Offline', r
          assert r['version']=='v83', r
          assert r['status']=='promoted', r
          print(json.dumps(r,indent=2))
          PY
          while IFS= read -r file; do
            rel="${file#site/}"
            echo "GET $BASE_URL/$rel"
            curl -fsS --retry 3 --connect-timeout 10 "$BASE_URL/$rel" -o /tmp/asset
            test -s /tmp/asset
          done < <(find site/assets/trainer -type f | sort)

      - name: Browser smoke live analyser and trainer
        env:
          BASE_URL: ${{ steps.select.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright
          url=os.environ['BASE_URL']
          evidence={'url':url}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              response=page.goto(url,wait_until='networkidle',timeout=90000)
              evidence['http_status']=response.status if response else None
              evidence['title']=page.title()
              text=page.locator('body').inner_text(timeout=30000)
              evidence['has_app_marker']='Poker Range Equity' in text
              evidence['has_training_marker']='Training' in text or 'Entraînement' in text or 'trainer' in text.lower()
              evidence['has_equity_marker']='Équité' in text or 'Equity' in text
              evidence['console_errors']=[]
              # Exercise visible one-click street controls when present and ensure the page stays responsive.
              buttons=page.locator('.street-btn')
              evidence['street_buttons']=buttons.count()
              if buttons.count():
                  buttons.first.click()
              evidence['body_length']=len(text)
              page.screenshot(path='/tmp/live-site.png',full_page=False)
              browser.close()
          assert evidence['http_status']==200, evidence
          assert evidence['has_app_marker'], evidence
          assert evidence['has_equity_marker'], evidence
          print(json.dumps(evidence,indent=2,sort_keys=True))
          open('/tmp/browser-smoke.json','w').write(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: live-production-smoke-${{ github.sha }}
          path: |
            /tmp/url-probe.json
            /tmp/live-release.json
            /tmp/browser-smoke.json
            /tmp/live-site.png
          if-no-files-found: error
