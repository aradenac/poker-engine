name: Validate Hero range compliance

on:
  push:
    paths:
      - 'site/hero-compliance.js'
      - 'site/hero-compliance-replayer.js'
      - 'site/hero-ranges-app.js'
      - 'site/trainer.js'
      - 'site/RELEASE.json'
      - 'tests/hero_ranges/test_hero_compliance.mjs'
      - 'tests/hero_ranges/smoke_hero_compliance.py'
      - 'tests/hero_ranges/smoke_hero_compliance_browser.py'
      - 'tests/regression/hand_262024556922.json'
      - 'tools/patches/patch_hero_compliance_replayer_v1.py'
      - 'tools/patches/patch_hero_compliance_release_v1.py'
      - 'tools/write_site_release.py'
      - '.github/workflows/hero-range-compliance.yml'
  pull_request:
    paths:
      - 'site/hero-compliance.js'
      - 'site/hero-compliance-replayer.js'
      - 'site/hero-ranges-app.js'
      - 'site/trainer.js'
      - 'site/RELEASE.json'
      - 'tests/hero_ranges/test_hero_compliance.mjs'
      - 'tests/hero_ranges/smoke_hero_compliance.py'
      - 'tests/hero_ranges/smoke_hero_compliance_browser.py'
      - 'tests/regression/hand_262024556922.json'
      - 'tools/patches/patch_hero_compliance_replayer_v1.py'
      - 'tools/patches/patch_hero_compliance_release_v1.py'
      - 'tools/write_site_release.py'
      - '.github/workflows/hero-range-compliance.yml'

permissions:
  contents: read

concurrency:
  group: hero-range-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check site/hero-compliance.js
          node --check site/hero-compliance-replayer.js
          node --check site/hero-ranges-app.js
      - name: Compliance semantics
        run: node tests/hero_ranges/test_hero_compliance.mjs
      - name: Static replayer integration
        run: |
          python3 tools/patches/patch_hero_compliance_replayer_v1.py --check
          python3 tests/hero_ranges/smoke_hero_compliance.py
      - name: Release identity includes compliance assets
        run: |
          python3 tools/patches/patch_hero_compliance_release_v1.py --check
          python3 tools/write_site_release.py --check
      - name: Preserve Hero repository contract
        run: node tests/hero_ranges/test_hero_range_repository.mjs

  browser-smoke:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser runtime
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Serve static application
        run: |
          python3 -m http.server 8765 --directory site >/tmp/hero-compliance-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hero-compliance-http.log
          exit 1
      - name: Exercise real PokerStars Hero compliance and deep-link
        run: python3 tests/hero_ranges/smoke_hero_compliance_browser.py
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hero-compliance-http.log || true
