name: Validate Hero range compliance

on:
  push:
    paths:
      - 'site/hero-compliance.js'
      - 'site/hero-ranges.js'
      - 'site/hero-ranges-app.js'
      - 'site/index.html'
      - 'site/RELEASE.json'
      - 'tests/hero_ranges/test_hero_range_compliance.mjs'
      - 'tests/hero_ranges/smoke_hero_compliance.py'
      - 'tests/regression/hand_262024556922.json'
      - 'tests/trainer/test_site_release_identity.py'
      - 'tools/patches/apply_hero_range_compliance.py'
      - 'tools/write_site_release.py'
      - '.github/workflows/hero-range-compliance.yml'
  pull_request:
    paths:
      - 'site/hero-compliance.js'
      - 'site/hero-ranges.js'
      - 'site/hero-ranges-app.js'
      - 'site/index.html'
      - 'site/RELEASE.json'
      - 'tests/hero_ranges/test_hero_range_compliance.mjs'
      - 'tests/hero_ranges/smoke_hero_compliance.py'
      - 'tests/regression/hand_262024556922.json'
      - 'tests/trainer/test_site_release_identity.py'
      - 'tools/patches/apply_hero_range_compliance.py'
      - 'tools/write_site_release.py'
      - '.github/workflows/hero-range-compliance.yml'

permissions:
  contents: read

concurrency:
  group: hero-range-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check site/hero-ranges.js
          node --check site/hero-ranges-app.js
          node --check site/hero-compliance.js
      - name: Repository and compliance contracts
        run: |
          node tests/hero_ranges/test_hero_range_repository.mjs
          node tests/hero_ranges/test_hero_range_compliance.mjs
      - name: Replayer integration is idempotent
        run: |
          sha256sum site/index.html site/hero-ranges.js site/hero-ranges-app.js > /tmp/hero-compliance-before.sha
          python3 tools/patches/apply_hero_range_compliance.py
          sha256sum site/index.html site/hero-ranges.js site/hero-ranges-app.js > /tmp/hero-compliance-after.sha
          diff -u /tmp/hero-compliance-before.sha /tmp/hero-compliance-after.sha
      - name: Release identity
        run: |
          python3 tools/write_site_release.py --check
          python3 tests/trainer/test_site_release_identity.py

  browser-smoke:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser runtime
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Serve static application
        run: |
          python3 -m http.server 8765 --directory site >/tmp/hero-compliance-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hero-compliance-http.log
          exit 1
      - name: Exercise compliance on real PokerStars history
        run: python3 tests/hero_ranges/smoke_hero_compliance.py
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/hero-compliance-http.log || true
