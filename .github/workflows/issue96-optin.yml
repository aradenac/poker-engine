name: Issue 96 opt-in compatibility

on:
  push:
    branches: [issue-96-preflop-contract]
    paths:
      - tools/tmp_issue96_optin.py
      - .github/workflows/issue96-optin.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-96-preflop-contract
          fetch-depth: 0
      - name: Apply opt-in compatibility patch
        run: python3 tools/tmp_issue96_optin.py
      - name: Verify new contract opt-in
        run: |
          python3 -m py_compile tools/training/increment_decisions.py
          python3 tests/preflop/test_context_contract.py
          python3 tests/preflop/test_increment_decisions_contract.py
          python3 tests/preflop/test_site_preflop_contract.py
      - name: Prove historical JSONL remains byte-identical
        run: |
          python3 tools/training/build_incremental_decisions_v2.py \
            --source training/runs/20260909_population_increment_v2/source/RoiDePiqueNique_training2_delta_after_v4v5.zip \
            --out /tmp/poker_population_increment_decisions_v2.jsonl \
            --summary /tmp/model-a-0909-summary.json
          cmp /tmp/poker_population_increment_decisions_v2.jsonl \
            training/runs/20260909_population_increment_v2/data/poker_population_increment_decisions_v2.jsonl
      - name: Prove explicit v1 enrichment works
        run: |
          python3 tools/training/build_incremental_decisions_v2.py \
            --source training/runs/20260909_population_increment_v2/source/RoiDePiqueNique_training2_delta_after_v4v5.zip \
            --out /tmp/poker_population_increment_decisions_v2_v1.jsonl \
            --summary /tmp/model-a-0909-summary-v1.json \
            --preflop-contract-v1
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/poker_population_increment_decisions_v2_v1.jsonl').read_text().splitlines()]
          pf=[r for r in rows if r['street']=='preflop']
          assert pf and all(r['preflop_context_v1']['state_timing']=='BEFORE_ACTION' for r in pf)
          assert all('action_sizing_v1' in r for r in pf)
          print(f'opt-in contexts verified: {len(pf)} preflop rows')
          PY
      - name: Commit durable migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Issue #96: make preflop v1 extraction opt-in"
          git push origin HEAD:issue-96-preflop-contract
