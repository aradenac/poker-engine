name: Fix French Model B button parser

on:
  push:
    branches:
      - issue-46-french-position-audit
    paths:
      - '.github/workflows/fix-french-button-parser.yml'
      - 'tests/independent_profiles/test_french_button_position.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-french-model-b-button-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch exact French button grammar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/training/independent_profiles/build_model_b.py')
          s=p.read_text()
          old='r"(?:Siège|Siege|Place)\\s*#?(\\d+)\\s+est le bouton",'
          new='r"(?:Siège|Siege|Place)\\s*#?(\\d+)\\s+est\\s+(?:le|au)\\s+bouton",'
          if old not in s:
              raise SystemExit('expected French button regex not found')
          p.write_text(s.replace(old,new,1))
          PY
          python3 tests/independent_profiles/test_french_button_position.py
          python3 tests/independent_profiles/test_build_model_b.py
      - name: Re-audit all 31,003 scoped hands after parser fix
        run: |
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          from tools.datasets.build_hand_history_increment import split_for
          from tools.training.independent_profiles.build_model_b import parse_hand
          from tools.training.independent_profiles.build_player_features import merge_archives

          archives=[
            Path('training/datasets/NLHE_100-200/source/NLHE 100-200.zip'),
            Path('training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'),
            Path('training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip'),
          ]
          records, provenance=merge_archives(archives, {'100/200'})
          rows=[]
          for hid, record in records.items():
              hand=parse_hand(record)
              assert hand is not None
              positions=hand.get('positions') or {}
              rows.append({
                'split':split_for(hid),
                'language':record.language,
                'button_missing':hand.get('button') is None,
                'all_positions_na':bool(positions) and all(v=='NA' for v in positions.values()),
              })
          def summary(xs):
              return {
                'hands':len(xs),
                'languages':dict(sorted(collections.Counter(x['language'] for x in xs).items())),
                'button_missing':sum(x['button_missing'] for x in xs),
                'all_positions_na':sum(x['all_positions_na'] for x in xs),
              }
          doc={
            'schema':'model-b-french-position-audit/v1',
            'status':'PASS_AFTER_FIX',
            'dataset_provenance':provenance,
            'before_fix':{
              'full_corpus_french_hands':994,
              'full_corpus_button_missing':994,
              'train_french_hands':803,
              'validation_french_hands':90,
              'test_french_hands':101
            },
            'after_fix':{
              'full_corpus':summary(rows),
              'by_split':{s:summary([x for x in rows if x['split']==s]) for s in ('TRAIN','VALIDATION','TEST')},
            },
            'production_effect':'NONE'
          }
          assert doc['after_fix']['full_corpus']['hands']==31003
          assert doc['after_fix']['full_corpus']['button_missing']==0, doc
          assert doc['after_fix']['full_corpus']['all_positions_na']==0, doc
          out=Path('training/runs/20260913_model_b_response_v3/french_position_audit.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(doc,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps(doc['after_fix'],indent=2,ensure_ascii=False))
          PY
      - name: Persist parser fix and audit evidence
        run: |
          git config user.name 'poker-engine model-b bot'
          git config user.email 'model-b-bot@users.noreply.github.com'
          git add tools/training/independent_profiles/build_model_b.py training/runs/20260913_model_b_response_v3/french_position_audit.json
          git commit -m 'Fix French button parsing in Model B'
          git push origin HEAD:${GITHUB_REF_NAME}
