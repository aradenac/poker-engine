name: Validate calculated Hero range export

on:
  pull_request:
    paths:
      - 'src/preflop/decision.js'
      - 'src/preflop/hero_range_export.js'
      - 'site/hero-ranges.js'
      - 'tests/preflop/test_decision_contract.js'
      - 'tests/hero_ranges/test_hero_range_repository.mjs'
      - 'tests/hero_ranges/test_calculated_range_export.mjs'
      - 'docs/hero-calculated-range-candidate.md'
      - '.github/workflows/hero-calculated-range-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculated-range-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/preflop/decision.js
          node --check src/preflop/hero_range_export.js
          node --check site/hero-ranges.js
          node --check tests/hero_ranges/test_calculated_range_export.mjs
      - name: Preserve preflop decision contract
        run: node tests/preflop/test_decision_contract.js
      - name: Preserve Hero repository contract
        run: node tests/hero_ranges/test_hero_range_repository.mjs
      - name: Calculated range export contract
        run: node tests/hero_ranges/test_calculated_range_export.mjs
