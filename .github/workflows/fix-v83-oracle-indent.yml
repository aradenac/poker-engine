name: Fix v83 oracle adapter indentation

on:
  push:
    paths:
      - '.github/workflows/fix-v83-oracle-indent.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reindent oracle adapter safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path=Path('tools/simulation/sequential_postflop.py')
          text=path.read_text()
          start_marker='        detail = await self.page.evaluate(\n'
          end_marker='\n\n\nasync def rollout'
          start=text.index(start_marker)
          end=text.index(end_marker,start)
          block=text[start:end]
          # Strip only the current method-level prefix from the first line; the
          # previous one-shot patch left later lines at columns 0/4.
          body=block[len('        '):]
          # Normalize by dedenting the malformed block, then re-indent the entire
          # Python statement sequence inside AnalyzerOracle.decide.
          body=textwrap.dedent(body)
          fixed=textwrap.indent(body,'        ')
          if 'reconstructedBestLabel' not in fixed or 'self.cache[key]' not in fixed:
              raise SystemExit('oracle adapter markers missing after reindent')
          path.write_text(text[:start]+fixed+text[end:])
          PY
          python3 -m py_compile tools/simulation/sequential_postflop.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-v83-oracle-indent.yml
      - name: Commit indentation fix
        run: |
          git config user.name 'poker-engine maintenance bot'
          git config user.email 'maintenance-bot@users.noreply.github.com'
          git add tools/simulation/sequential_postflop.py .github/workflows/fix-v83-oracle-indent.yml
          git commit -m 'Fix v83 oracle adapter indentation'
          git push
