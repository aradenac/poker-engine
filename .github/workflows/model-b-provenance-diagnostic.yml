name: Diagnose Model B comparison provenance

on:
  push:
    branches:
      - issue-38-model-b-final-20260913
    paths:
      - '.github/workflows/model-b-provenance-diagnostic.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute archive identity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.training.independent_profiles.build_player_features import merge_archives

          paths = [
              Path('training/datasets/NLHE_100-200/source/NLHE 100-200.zip'),
              Path('training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip'),
              Path('training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip'),
          ]
          by_id, provenance = merge_archives(paths, {'100/200'})
          print(json.dumps(provenance, indent=2))
          print('first_ids=', sorted(by_id)[:5])
          print('last_ids=', sorted(by_id)[-5:])
          expected = '641860209e455957b279553d8847edcb74bd09474703f21e2f935a652c09cd87'
          observed = provenance['sorted_hand_ids_sha256']
          print('expected=', expected)
          print('observed=', observed)
          if observed != expected:
              raise SystemExit(2)
          PY
