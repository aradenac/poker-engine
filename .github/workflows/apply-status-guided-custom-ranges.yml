name: Apply Guided/custom-range trainer status

on:
  push:
    branches: [docs-trainer-guided-custom-ranges]
    paths:
      - '.github/workflows/apply-status-guided-custom-ranges.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-trainer-guided-custom-ranges
          fetch-depth: 0
      - name: Patch project status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.project/STATUS.md')
          s=p.read_text()
          marker='## Trainer performance optimization\n'
          section='''## Trainer Guided consistency and Hero custom ranges\n\nIssues #30 and #31 are completed and merged after live trainer testing.\n\n- #30 / PR #32 / `b31bbcac8caae2fac31b15cec85c5bdd5e907cc2`: Guided mode now treats the recommendation displayed before Hero acts as the canonical verdict baseline. Sizing-only Model-A labels such as `25% pot` are resolved to BET/RAISE from decision context; clicking an untouched Guided BET/RAISE uses the exact displayed `bestCostBB`; playing the exact guide reuses the pre-action result and must report zero EV loss. Evaluating an alternative Hero action may compute its chosen EV but cannot replace the guide ACTION / exact sizing / best EV.\n- #31 / PR #33 / `d3b74d0c934c438f29361928423679a1b309d250`: Hero hole cards are no longer sampled uniformly. The trainer consumes `site/assets/trainer/hero/custom_ranges_v1.json`, normalized from the user's `Custom` range-folder export (source SHA-256 `1248258112562757e49df545e97f9e54b2dde163fdc755adf0029e89e580e8cb`).\n- Hero PFA deals use the supplied `Openings` frequencies by position; every non-FOLD opening action is retained, including custom `Multiway` entries. Exact two-card combos receive the hand-class frequency, preserving natural pair/suited/offsuit combo multiplicity.\n- Hero SRP-caller deals use only `VS Opening` -> `Call`; 3-bet and 4-bet/shove entries are excluded because they do not form the current trainer's single-raised-pot caller scenario.\n- The supplied custom export contains BTN/CO/HJ/LJ/SB but no BB range. Unsupported Hero role/position combinations are resampled rather than invented, so there is intentionally no arbitrary Hero BB caller drill until a BB range is supplied.\n- Opponent ranges/actions remain independently generated by promoted Model B v2. Model A formulas, candidate sets and Monte-Carlo trial counts are unchanged.\n\nRegression coverage now includes `tests/trainer/test_trainer_hero_ranges.py`; the browser smoke asserts that the actually dealt Hero notation has positive frequency in the exact Custom role/position range and also rechecks Guided recommendation/verdict identity.\n\n'''
          if section in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('status insertion marker missing')
          p.write_text(s.replace(marker, section+marker, 1))
          PY
      - name: Validate status
        run: |
          grep -q 'Trainer Guided consistency and Hero custom ranges' .project/STATUS.md
          grep -q 'd3b74d0c934c438f29361928423679a1b309d250' .project/STATUS.md
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-status-guided-custom-ranges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Record Guided consistency and Hero custom ranges'
          git push origin HEAD:docs-trainer-guided-custom-ranges
