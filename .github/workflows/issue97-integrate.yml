name: Issue 97 integrate Hero range editor

on:
  push:
    branches:
      - issue-97-hero-range-repository
    paths:
      - 'tools/patches/apply_hero_range_editor.py'
      - 'tools/write_site_release.py'
      - 'tests/trainer/test_site_release_identity.py'
      - '.github/workflows/issue97-integrate.yml'

permissions:
  contents: write

concurrency:
  group: issue97-integrate
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-97-hero-range-repository
          fetch-depth: 0
      - name: Integrate editor links
        run: python3 tools/patches/apply_hero_range_editor.py
      - name: Validate repository contract before commit
        run: |
          node --check site/hero-ranges.js
          node --check site/hero-ranges-app.js
          node tests/hero_ranges/test_hero_range_repository.mjs
      - name: Regenerate application identity
        run: python3 tools/write_site_release.py
      - name: Commit durable integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/RELEASE.json
          if git diff --cached --quiet; then
            echo 'integration already current'
            exit 0
          fi
          git commit -m 'Issue #97: integrate Hero range editor into static app'
          git push origin HEAD:issue-97-hero-range-repository
