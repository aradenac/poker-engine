name: Issue 95 one-shot population refactor

on:
  push:
    branches:
      - issue-95-population-isolation-refactor
    paths:
      - 'tools/patches/issue95_population_isolation_refactor.py'
      - '.github/workflows/issue95-one-shot-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-95-population-isolation-refactor
          fetch-depth: 0
      - name: Apply deterministic refactor
        run: python3 tools/patches/issue95_population_isolation_refactor.py
      - name: Compile and test population boundary
        run: |
          python3 -m py_compile tools/populations/*.py tools/simulation/*.py tests/populations/*.py tests/simulation/test_model_b_runtime.py tests/simulation/test_scenarios.py
          python3 tests/populations/test_population_registry.py
          python3 tests/simulation/test_model_b_runtime.py
          python3 tests/simulation/test_scenarios.py
          python3 -m tools.simulation.sequential_postflop --help >/tmp/arena-help.txt
          python3 -m tools.simulation.sequential_postflop \
            --population legacy_pokerstars_nlhe_100-200_play_6max_mixed_v1 \
            --generate-only --n 1 --reps 1 --seed 20260912 \
            --scenario-out /tmp/issue95-scenario.json --out /tmp/issue95-arena.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/issue95-scenario.json'))
          assert d['schema']=='sequential-arena-scenario-manifest/v2', d['schema']
          assert d['population_id']=='legacy_pokerstars_nlhe_100-200_play_6max_mixed_v1'
          assert d['cache_namespace']==d['population_id']
          print(d['scenario_fingerprint_sha256'])
          PY
      - name: Commit refactor and remove one-shot machinery
        run: |
          rm tools/patches/issue95_population_isolation_refactor.py .github/workflows/issue95-one-shot-refactor.yml
          git config user.name 'poker-engine refactor bot'
          git config user.email 'refactor-bot@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Issue #95: bind arena and Model B to explicit populations'
          git push origin HEAD:issue-95-population-isolation-refactor
