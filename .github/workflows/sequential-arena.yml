name: Validate sequential independent arena

on:
  push:
    paths:
      - 'tools/simulation/**'
      - 'tests/simulation/**'
      - 'tools/sequential_postflop_population_sim_v4.py'
      - 'training/registry.json'
      - 'training/runs/20260912_independent_profiles_v2/model/**'
      - 'training/datasets/NLHE_100-200/**/*.zip'
      - 'training/PROMOTION_GATE_CONTRACT.json'
      - 'training/gates/**'
      - 'tools/evaluate_promotion_gates.py'
      - 'tests/test_promotion_gates.py'
      - 'site/RELEASE.json'
      - 'site/index.html'
      - '.github/workflows/sequential-arena.yml'
  pull_request:
    paths:
      - 'tools/simulation/**'
      - 'tests/simulation/**'
      - 'tools/sequential_postflop_population_sim_v4.py'
      - 'training/registry.json'
      - 'training/runs/20260912_independent_profiles_v2/model/**'
      - 'training/datasets/NLHE_100-200/**/*.zip'
      - 'training/PROMOTION_GATE_CONTRACT.json'
      - 'training/gates/**'
      - 'tools/evaluate_promotion_gates.py'
      - 'tests/test_promotion_gates.py'
      - 'site/RELEASE.json'
      - 'site/index.html'
      - '.github/workflows/sequential-arena.yml'

permissions:
  contents: read

concurrency:
  group: sequential-arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile simulation and gate modules
        run: python3 -m py_compile tools/simulation/*.py tools/sequential_postflop_population_sim_v4.py tools/evaluate_promotion_gates.py tests/test_promotion_gates.py
      - name: Promotion gate contract
        run: |
          python3 tests/test_promotion_gates.py
          python3 tools/evaluate_promotion_gates.py \
            --evidence training/gates/20260912_evidence.json \
            --out /tmp/promotion-gate-report.json
          python3 tools/evaluate_promotion_gates.py \
            --evidence training/gates/20260912_evidence.json \
            --require-ready >/tmp/promotion-gate-require-ready.json
      - name: Oracle and policy contracts
        run: |
          python3 tools/sequential_postflop_population_sim_v4.py --help
          python3 tests/simulation/test_oracle_contract.py
          node tests/simulation/test_oracle_workers.cjs
          python3 tests/simulation/test_rollout_accounting.py
      - name: Model B runtime tests
        run: python3 tests/simulation/test_model_b_runtime.py
      - name: Scenario generation tests
        run: python3 tests/simulation/test_scenarios.py
      - name: Strategic baseline report tests
        run: python3 tests/simulation/test_baseline_report.py
      - name: CLI scenario reproducibility
        run: |
          python3 -m tools.simulation.sequential_postflop \
            --generate-only --n 2 --reps 2 --seed 20260912 \
            --scenario-out /tmp/scenarios-a.json --out /tmp/generate-a.json
          python3 -m tools.simulation.sequential_postflop \
            --generate-only --n 2 --reps 2 --seed 20260912 \
            --scenario-out /tmp/scenarios-b.json --out /tmp/generate-b.json
          cmp /tmp/scenarios-a.json /tmp/scenarios-b.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/scenarios-a.json'))
          assert a['schema']=='sequential-arena-scenario-manifest/v1'
          assert len(a['scenarios'])==4
          assert a['model_b']['alias']=='independent_model_b_v2'
          print(a['scenario_fingerprint_sha256'])
          PY

  browser-smoke:
    needs: deterministic-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Run one deterministic v83 rollout
        run: |
          python3 -m tools.simulation.sequential_postflop \
            --n 1 --reps 1 --seed 20260912 --trials 1200 \
            --policies current \
            --scenario-out /tmp/scenario.json \
            --out /tmp/arena.json
      - name: Repeat in a fresh browser and verify a different trial budget
        run: |
          python3 tools/sequential_postflop_population_sim_v4.py \
            --scenario-manifest /tmp/scenario.json --trials 1200 \
            --policies current --out /tmp/arena-repeat.json
          python3 -m tools.simulation.sequential_postflop \
            --scenario-manifest /tmp/scenario.json --trials 2400 \
            --policies current --out /tmp/arena-2400.json
      - name: Exercise recovered review-detail state
        run: |
          python3 -m tools.simulation.baseline_runner \
            --n 1 --start 5 --reps 2 --seed 20260912 --split TEST --trials 1200 \
            --policies current \
            --scenario-out /tmp/fallback-regression-scenarios.json \
            --out /tmp/fallback-regression-arena.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/fallback-regression-arena.json'))
          assert len(d['scenario_manifest']['scenarios'])==2
          assert len(d['results'])==2
          fb=d['metadata']['oracle_reconstruction_fallback']
          assert fb['count'] >= 1, fb
          assert fb['unique_states'] >= 1, fb
          assert all(x['terminal'] for x in d['results'])
          print(json.dumps(fb, indent=2))
          PY
      - name: Validate smoke result contract
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/arena.json'))
          repeat=json.load(open('/tmp/arena-repeat.json'))
          assert d==repeat, 'Fresh-browser full rollout is not reproducible'
          assert d['metadata']['observed_monte_carlo_trials']==[1200]
          other=json.load(open('/tmp/arena-2400.json'))
          assert other['metadata']['observed_monte_carlo_trials']==[2400]
          assert d['schema']=='sequential-independent-arena/v2'
          assert d['metadata']['model_b']['alias']=='independent_model_b_v2'
          assert d['metadata']['master_seed']==20260912
          assert d['metadata']['policies']==['current']
          assert len(d['results'])==1
          assert d['results'][0]['scenario_id']==d['scenario_manifest']['scenarios'][0]['scenario_id']
          assert 'current' in d['summary']
          print(json.dumps(d['summary'], indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequential-arena-reproducibility
          path: |
            /tmp/arena*.json
            /tmp/fallback-regression-*.json

  v83-baseline-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deterministic-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Run frozen VALIDATION baseline and diagnostic policy set
        run: |
          python3 -m tools.simulation.baseline_runner \
            --n 32 --reps 2 --seed 20260912 --split VALIDATION --trials 1200 \
            --policies current,no_jam,cap_2,cap_3,cap_4 \
            --scenario-out /tmp/v83-baseline-validation-scenarios.json \
            --out /tmp/v83-baseline-validation-arena.json
          python3 -m tools.simulation.baseline_report \
            --arena /tmp/v83-baseline-validation-arena.json \
            --out /tmp/v83-baseline-validation-report.json
      - name: Validate baseline identity
        run: |
          python3 - <<'PY'
          import json, os
          raw=json.load(open('/tmp/v83-baseline-validation-arena.json'))
          d=json.load(open('/tmp/v83-baseline-validation-report.json'))
          assert d['schema']=='sequential-v83-baseline-report/v1'
          assert d['provenance']['scenario_split']=='VALIDATION'
          assert d['provenance']['model_b']['alias']=='independent_model_b_v2'
          assert d['provenance']['code_commit']==os.environ['GITHUB_SHA']
          assert d['sample']['base_hands'] >= 20
          assert d['policies']['current']['overall']['utility_ci95_cluster_bootstrap'] is not None
          assert d['diagnostic_policy_set_regret'] is not None
          assert 'oracle_reconstruction_fallback' in raw['metadata']
          print(json.dumps({'sample':d['sample'],'fallback':raw['metadata']['oracle_reconstruction_fallback']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v83-model-b-v2-baseline-validation
          path: |
            /tmp/v83-baseline-validation-scenarios.json
            /tmp/v83-baseline-validation-arena.json
            /tmp/v83-baseline-validation-report.json

  v83-baseline-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deterministic-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Run frozen current-policy TEST reference only
        run: |
          python3 -m tools.simulation.baseline_runner \
            --n 32 --reps 2 --seed 20260912 --split TEST --trials 1200 \
            --policies current \
            --scenario-out /tmp/v83-baseline-test-scenarios.json \
            --out /tmp/v83-baseline-test-arena.json
          python3 -m tools.simulation.baseline_report \
            --arena /tmp/v83-baseline-test-arena.json \
            --out /tmp/v83-baseline-test-report.json
      - name: Validate protected TEST reference
        run: |
          python3 - <<'PY'
          import json, os
          raw=json.load(open('/tmp/v83-baseline-test-arena.json'))
          d=json.load(open('/tmp/v83-baseline-test-report.json'))
          assert d['schema']=='sequential-v83-baseline-report/v1'
          assert d['provenance']['scenario_split']=='TEST'
          assert d['provenance']['policies']==['current']
          assert d['provenance']['model_b']['alias']=='independent_model_b_v2'
          assert d['provenance']['code_commit']==os.environ['GITHUB_SHA']
          assert d['sample']['base_hands'] >= 20
          assert d['policies']['current']['overall']['utility_ci95_cluster_bootstrap'] is not None
          assert d['diagnostic_policy_set_regret'] is None
          assert 'oracle_reconstruction_fallback' in raw['metadata']
          print(json.dumps({'sample':d['sample'],'fallback':raw['metadata']['oracle_reconstruction_fallback']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v83-model-b-v2-baseline-test
          path: |
            /tmp/v83-baseline-test-scenarios.json
            /tmp/v83-baseline-test-arena.json
            /tmp/v83-baseline-test-report.json
