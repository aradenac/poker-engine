name: Apply trainer parallel review v1

on:
  push:
    branches: [issue-23-trainer-parallel-review-workers]
    paths:
      - '.github/workflows/apply-trainer-parallel-review-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest branch head
        run: git pull --rebase origin issue-23-trainer-parallel-review-workers
      - name: Apply deterministic patch
        run: python3 tools/patches/patch_trainer_parallel_review_v1.py
      - name: Validate contracts
        run: |
          node --check site/trainer.js
          python3 tests/trainer/test_trainer_static.py
          python3 tests/trainer/test_trainer_latency_contract.py
          python3 tests/trainer/test_trainer_preload_contract.py
          python3 tests/trainer/test_trainer_result_cache_contract.py
          python3 tests/trainer/test_trainer_parallel_review_contract.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-trainer-parallel-review-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html .github/workflows/apply-trainer-parallel-review-v1.yml
          git commit -m 'Parallelize trainer review workers with bounded concurrency'
          git push origin HEAD:issue-23-trainer-parallel-review-workers
