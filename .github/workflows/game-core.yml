name: Validate full-hand game core

on:
  pull_request:
    paths:
      - 'tools/simulation/game_core.py'
      - 'tools/simulation/hand_history_state.py'
      - 'tests/simulation/test_game_core.py'
      - 'tests/simulation/test_game_core_consolidated_regressions.py'
      - 'tests/simulation/test_hand_history_state.py'
      - 'tests/simulation/test_rollout_accounting.py'
      - 'docs/full_hand_game_core.md'
      - '.github/workflows/game-core.yml'
  workflow_dispatch:

jobs:
  game-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          python3 -m py_compile \
            tools/simulation/game_core.py \
            tools/simulation/hand_history_state.py \
            tests/simulation/test_game_core.py \
            tests/simulation/test_game_core_consolidated_regressions.py \
            tests/simulation/test_hand_history_state.py
      - name: Full-hand rules and accounting
        run: |
          python3 tests/simulation/test_game_core.py
          python3 tests/simulation/test_game_core_consolidated_regressions.py
      - name: EN/FR public hand reconstruction
        run: python3 tests/simulation/test_hand_history_state.py
      - name: Preserve legacy heads-up accounting fixtures
        run: python3 tests/simulation/test_rollout_accounting.py
