name: Validate full-hand game core

on:
  pull_request:
    paths:
      - 'tools/simulation/game_core.py'
      - 'tools/simulation/hand_history_state.py'
      - 'tests/simulation/test_game_core.py'
      - 'tests/simulation/test_game_core_consolidated_regressions.py'
      - 'tests/simulation/test_hand_history_state.py'
      - 'tests/simulation/test_rollout_accounting.py'
      - 'docs/full_hand_game_core.md'
      - '.python-version'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tests/ci/test_repro_current_core_batch.py'
      - 'analysis/workflow_audit/repro_current_core_batch_before_after.json'
      - '.github/workflows/game-core.yml'
  workflow_dispatch:

jobs:
  game-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify locked REPRO runtime
        run: python3 tools/repro_ci_environment.py verify
      - name: REPRO current-core anti-bypass contract
        run: PYTHONPATH=. python3 tests/ci/test_repro_current_core_batch.py
      - name: Syntax
        run: |
          python3 -m py_compile \
            tools/simulation/game_core.py \
            tools/simulation/hand_history_state.py \
            tests/simulation/test_game_core.py \
            tests/simulation/test_game_core_consolidated_regressions.py \
            tests/simulation/test_hand_history_state.py
      - name: Full-hand rules and accounting
        run: |
          python3 tests/simulation/test_game_core.py
          python3 tests/simulation/test_game_core_consolidated_regressions.py
      - name: EN/FR public hand reconstruction
        run: python3 tests/simulation/test_hand_history_state.py
      - name: Preserve legacy heads-up accounting fixtures
        run: python3 tests/simulation/test_rollout_accounting.py
