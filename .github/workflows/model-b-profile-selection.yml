name: Select independent Model B profile count

on:
  push:
    paths:
      - 'tools/training/independent_profiles/select_profile_count.py'
      - 'tools/training/independent_profiles/build_model_b.py'
      - 'tools/training/independent_profiles/evaluate_model_b.py'
      - 'training/runs/20260912_independent_profiles_v2/features/**'
      - 'training/datasets/NLHE_100-200/**/*.zip'
      - '.github/workflows/model-b-profile-selection.yml'

permissions:
  contents: write

concurrency:
  group: model-b-profile-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select K on validation only
        run: |
          python3 -m tools.training.independent_profiles.select_profile_count \
            --features 'training/runs/20260912_independent_profiles_v2/features/player_features.json' \
            --archive 'training/datasets/NLHE_100-200/source/NLHE 100-200.zip' \
            --archive 'training/datasets/NLHE_100-200/snapshots/20260909/source/RoiDePiqueNique_training2.zip' \
            --stake 100/200 \
            --exclude-player RoiDePiqueNique \
            --k 3 --k 4 --k 5 --k 6 --k 7 --k 8 \
            --action-alpha 1 \
            --range-prior-strength 50 \
            --output 'training/runs/20260912_independent_profiles_v2/evaluation/profile_count_selection.json'

      - name: Validate no TEST tuning
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('training/runs/20260912_independent_profiles_v2/evaluation/profile_count_selection.json')
          d=json.loads(p.read_text())
          assert d['selection_split']=='VALIDATION'
          assert d['test_used_for_selection'] is False
          assert set(c['k'] for c in d['candidates'])=={3,4,5,6,7,8}
          assert d['selected_k'] in {3,4,5,6,7,8}
          for c in d['candidates']:
              assert math.isfinite(c['action_log_loss_improvement'])
              assert math.isfinite(c['range_log_loss_improvement'])
          print(json.dumps({'selected_k':d['selected_k'],'candidates':d['candidates']},indent=2))
          PY

      - name: Commit selection report
        run: |
          if [ -z "$(git status --porcelain training/runs/20260912_independent_profiles_v2/evaluation/profile_count_selection.json)" ]; then
            echo 'No selection report changes.'
            exit 0
          fi
          git config user.name 'poker-engine training bot'
          git config user.email 'training-bot@users.noreply.github.com'
          git add training/runs/20260912_independent_profiles_v2/evaluation/profile_count_selection.json
          git commit -m 'Select independent Model B profile count'
          git push
