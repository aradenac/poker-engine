name: Validate Model A multiway continuation

on:
  pull_request:
    paths:
      - 'tools/simulation/model_a_continuation.py'
      - 'tools/simulation/model_a_preflop_rollout.py'
      - 'tools/simulation/model_a_support_closure.py'
      - 'tests/simulation/test_model_a_continuation.py'
      - 'tests/simulation/test_model_a_preflop_rollout.py'
      - 'tests/simulation/test_model_a_support_closure.py'
      - 'tools/simulation/game_core.py'
      - 'tools/training/model_a_latent_ranges.py'
      - 'tools/training/model_a_postflop_runtime.py'
      - 'tools/training/refit_postflop_combo_policy.py'
      - 'training/models/preflop_population_model_v5.json'
      - 'training/models/postflop_population_model_v5.json'
      - 'training/runs/20260916_model_a_postflop_continuation_v1/postflop-selected-overlay.json'
      - '.python-version'
      - '.node-version'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tests/ci/test_repro_current_core_batch.py'
      - 'analysis/workflow_audit/repro_current_core_batch_before_after.json'
      - '.github/workflows/model-a-continuation.yml'
  push:
    branches: [main]
    paths:
      - 'tools/simulation/model_a_continuation.py'
      - 'tools/simulation/model_a_preflop_rollout.py'
      - 'tools/simulation/model_a_support_closure.py'
      - 'tests/simulation/test_model_a_continuation.py'
      - 'tests/simulation/test_model_a_preflop_rollout.py'
      - 'tests/simulation/test_model_a_support_closure.py'
      - '.python-version'
      - '.node-version'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tests/ci/test_repro_current_core_batch.py'
      - 'analysis/workflow_audit/repro_current_core_batch_before_after.json'
      - '.github/workflows/model-a-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify locked REPRO runtime
        run: python3 tools/repro_ci_environment.py verify
      - name: REPRO current-core anti-bypass contract
        run: PYTHONPATH=. python3 tests/ci/test_repro_current_core_batch.py
      - name: Compile
        run: |
          python3 -m py_compile \
            tools/simulation/model_a_continuation.py \
            tools/simulation/model_a_preflop_rollout.py \
            tools/simulation/model_a_support_closure.py \
            tests/simulation/test_model_a_continuation.py \
            tests/simulation/test_model_a_preflop_rollout.py \
            tests/simulation/test_model_a_support_closure.py
      - name: Model A continuation contracts
        run: PYTHONPATH=. python3 tests/simulation/test_model_a_continuation.py
      - name: Full-hand preflop rollout contracts
        run: PYTHONPATH=. python3 tests/simulation/test_model_a_preflop_rollout.py
      - name: Audited Model A support-closure contracts
        run: PYTHONPATH=. python3 tests/simulation/test_model_a_support_closure.py
      - name: Existing preflop grid contracts
        run: PYTHONPATH=. python3 tests/simulation/test_preflop_grid_evaluator.py
