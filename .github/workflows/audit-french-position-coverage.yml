name: Audit French position coverage

on:
  push:
    branches:
      - issue-46-french-position-audit
    paths:
      - '.github/workflows/audit-french-position-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Quantify current parser position coverage
        run: |
          python3 - <<'PY'
          import collections, json
          from tools.simulation.scenarios import eligible_base_scenarios
          from tools.simulation.model_b_runtime import hseed

          base, meta = eligible_base_scenarios(split='VALIDATION')
          ordered=sorted(base,key=lambda x:(hseed(20260912,'base-hand',x['hand_id']),x['hand_id']))
          selected=ordered[:96]

          def summarize(rows):
              out={
                'hands':len(rows),
                'language':dict(collections.Counter(x.get('source_language') for x in rows)),
                'hands_with_any_NA':sum(any(v=='NA' for v in x.get('positions',{}).values()) for x in rows),
                'hands_all_NA':sum(bool(x.get('positions')) and all(v=='NA' for v in x['positions'].values()) for x in rows),
              }
              out['by_language']={}
              for lang in sorted({x.get('source_language') for x in rows}):
                  ys=[x for x in rows if x.get('source_language')==lang]
                  out['by_language'][str(lang)]={
                    'hands':len(ys),
                    'hands_with_any_NA':sum(any(v=='NA' for v in x.get('positions',{}).values()) for x in ys),
                    'hands_all_NA':sum(bool(x.get('positions')) and all(v=='NA' for v in x['positions'].values()) for x in ys),
                  }
              return out

          doc={'eligible_validation':summarize(base),'selected_96':summarize(selected),'selected_hand_ids':[x['hand_id'] for x in selected]}
          print(json.dumps(doc,indent=2,ensure_ascii=False))
          open('/tmp/french-position-audit.json','w').write(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: french-position-audit
          path: /tmp/french-position-audit.json
