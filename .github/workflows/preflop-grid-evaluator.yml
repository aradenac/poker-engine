name: Validate preflop grid evaluator

on:
  pull_request:
    paths:
      - '.python-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - '.node-version'
      - 'tools/simulation/preflop_grid_evaluator.py'
      - 'tools/simulation/game_core.py'
      - 'src/preflop/decision.js'
      - 'tests/simulation/test_preflop_grid_evaluator.py'
      - 'tests/simulation/test_game_core.py'
      - 'tests/preflop/test_decision_contract.js'
      - 'docs/preflop-grid-evaluator.md'
      - '.github/workflows/preflop-grid-evaluator.yml'
      - '.github/actions/repro-runtime/action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflop-grid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/repro-runtime
        with:
          require-node: 'true'
          install-python-deps: 'true'
      - name: Syntax
        run: |
          python3 -m py_compile tools/simulation/preflop_grid_evaluator.py tests/simulation/test_preflop_grid_evaluator.py
          node --check src/preflop/decision.js
      - name: Preflop grid evaluator contract
        run: PYTHONPATH=. python3 tests/simulation/test_preflop_grid_evaluator.py
      - name: Preserve shared rules core
        run: PYTHONPATH=. python3 tests/simulation/test_game_core.py
      - name: Preserve canonical decision contract
        run: node tests/preflop/test_decision_contract.js
