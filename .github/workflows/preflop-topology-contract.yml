name: Preflop topology contract

on:
  push:
    paths:
      - 'tools/training/evaluate_preflop_topology_candidate.py'
      - 'tools/training/audit_preflop_runtime_topology_overlap.py'
      - 'tools/training/audit_preflop_key_runtime_parity.py'
      - 'tools/training/explain_preflop_key_runtime_mismatches.py'
      - 'tools/training/evaluate_preflop_free_check_matcher.py'
      - 'tests/training/test_preflop_topology_candidate.py'
      - 'tests/training/test_preflop_key_runtime_parity.py'
      - 'tests/training/test_preflop_free_check_matcher.py'
      - 'training/runs/20260912_population_increment_cycle/evaluation/preflop_targeted_topology_selection.json'
      - 'training/runs/20260912_population_increment_cycle/evaluation/preflop_canonical_runtime_parity.json'
      - '.python-version'
      - '.node-version'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tests/ci/test_repro_current_core_batch.py'
      - 'analysis/workflow_audit/repro_current_core_batch_before_after.json'
      - '.github/workflows/preflop-topology-contract.yml'
  pull_request:
    paths:
      - 'tools/training/evaluate_preflop_topology_candidate.py'
      - 'tools/training/audit_preflop_runtime_topology_overlap.py'
      - 'tools/training/audit_preflop_key_runtime_parity.py'
      - 'tools/training/explain_preflop_key_runtime_mismatches.py'
      - 'tools/training/evaluate_preflop_free_check_matcher.py'
      - 'tests/training/test_preflop_topology_candidate.py'
      - 'tests/training/test_preflop_key_runtime_parity.py'
      - 'tests/training/test_preflop_free_check_matcher.py'
      - 'training/runs/20260912_population_increment_cycle/evaluation/preflop_targeted_topology_selection.json'
      - 'training/runs/20260912_population_increment_cycle/evaluation/preflop_canonical_runtime_parity.json'
      - '.python-version'
      - '.node-version'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tests/ci/test_repro_current_core_batch.py'
      - 'analysis/workflow_audit/repro_current_core_batch_before_after.json'
      - '.github/workflows/preflop-topology-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify locked REPRO runtime
        run: python3 tools/repro_ci_environment.py verify
      - name: REPRO current-core anti-bypass contract
        run: PYTHONPATH=. python3 tests/ci/test_repro_current_core_batch.py
      - name: Runtime matcher parity and holdout tests
        run: |
          python3 tests/training/test_preflop_topology_candidate.py
          python3 tests/training/test_preflop_key_runtime_parity.py
          python3 tests/training/test_preflop_free_check_matcher.py
      - name: Verify persisted #61 and #88 decisions remain fail-closed
        run: |
          python3 - <<'PY'
          import json
          p='training/runs/20260912_population_increment_cycle/evaluation/preflop_targeted_topology_selection.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['schema']=='poker-preflop-topology-selection/v1'
          assert r['selection_split']=='VALIDATION'
          assert r['test_used'] is False
          assert r['test_authorized'] is False
          assert r['production_effect']=='NONE'
          assert r['outcome']=='RETAIN_BASELINE'
          assert r['candidate_contract']['target_nodes']==51
          assert r['candidate_contract']['target_train_rows']==2300
          assert r['runtime_overlap']['conclusion']=='CANONICAL_TOPOLOGY_EXTENSION_IS_RUNTIME_NO_OP'
          assert r['runtime_overlap']['canonical_diff_distribution_by_action']=={'hist':187}
          assert r['runtime_overlap']['target_canonical_diff_distribution']=={'hist':51}
          assert r['validation']['population_preflop_rows']==1676
          assert r['validation']['target_rows']==287
          assert r['validation']['all_alpha_candidates']['affected_rows']==0
          assert r['validation']['paired_bootstrap']['ci95']==[0.0,0.0]

          q='training/runs/20260912_population_increment_cycle/evaluation/preflop_canonical_runtime_parity.json'
          x=json.load(open(q, encoding='utf-8'))
          assert x['schema']=='poker-preflop-canonical-runtime-parity-decision/v1'
          assert x['selection_split']=='VALIDATION'
          assert x['test_used'] is False
          assert x['test_authorized'] is False
          assert x['production_effect']=='NONE'
          assert x['decision']=='RETAIN_CURRENT_MATCHER'
          assert x['canonical_key_audit']['mismatch_nodes']==4279
          assert x['canonical_key_audit']['explanation_distribution']=={'LEGACY_COMMA_DELIMITER_ONLY':4279}
          assert x['canonical_key_audit']['all_mismatches_explained'] is True
          assert x['runtime_equivalence_audit']['collision_classes']==18
          assert x['runtime_equivalence_audit']['class_cause_distribution']=={'free_check':18}
          assert x['runtime_equivalence_audit']['all_collisions_free_check_only'] is True
          assert x['strict_free_check_validation']['rows']==1676
          assert x['strict_free_check_validation']['changed_probability_rows']==2
          assert x['strict_free_check_validation']['paired_bootstrap']['ci95'][1]==0.0
          print(json.dumps({
            'status':'PASS',
            'topology_outcome':r['outcome'],
            'matcher_decision':x['decision'],
            'key_mismatches_explained':x['canonical_key_audit']['all_mismatches_explained'],
            'runtime_collision_classes':x['runtime_equivalence_audit']['collision_classes']
          }, indent=2))
          PY
