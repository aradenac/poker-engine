name: Validate Hero range PFC/PFPC context binding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/hero-ranges.js'
      - 'tools/preflop/context_contract.py'
      - 'tools/preflop/policy_context.py'
      - 'tools/simulation/hero_preflop_overlay.py'
      - 'tools/training/generate_hero_range_decisions.py'
      - 'tools/training/enrich_hero_range_context.py'
      - 'tools/training/materialize_hero_pfc_source.py'
      - 'tools/training/merge_hero_policy_context_sources.py'
      - 'tests/hero_ranges/test_hero_range_repository.mjs'
      - 'tests/preflop/test_context_contract.py'
      - 'tests/simulation/test_preflop_policy_context.py'
      - 'tests/simulation/test_hero_preflop_overlay.py'
      - 'tests/training/test_enrich_hero_range_context.py'
      - 'tests/training/test_persisted_hero_pfc_binding.py'
      - 'tests/training/test_hero_policy_context_sources.py'
      - 'training/runs/20260917_hero_preflop_169_btn_unopened_pfc_v1/**'
      - '.github/workflows/hero-range-pfc-context.yml'
  push:
    branches:
      - 'issue-107-canonical-pfc-generator-sol'
      - 'issue-107-policy-context-sol'
      - 'issue-107-unopened-multiposition-sol'

concurrency:
  group: hero-range-pfc-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile context, overlay and source-merge contracts
        run: |
          python3 -m py_compile \
            tools/preflop/policy_context.py \
            tools/simulation/hero_preflop_overlay.py \
            tools/training/enrich_hero_range_context.py \
            tools/training/materialize_hero_pfc_source.py \
            tools/training/merge_hero_policy_context_sources.py
      - name: Validate canonical exact context contract
        run: PYTHONPATH=. python3 tests/preflop/test_context_contract.py
      - name: Validate bucketed policy context and overlay binding
        run: |
          PYTHONPATH=. python3 tests/simulation/test_preflop_policy_context.py
          PYTHONPATH=. python3 tests/simulation/test_hero_preflop_overlay.py
      - name: Validate PFC source materialization and PFPC merge
        run: PYTHONPATH=. python3 tests/training/test_hero_policy_context_sources.py
      - name: Validate Hero repository PFC identity
        run: node tests/hero_ranges/test_hero_range_repository.mjs
      - name: Validate identity-only run enrichment
        run: PYTHONPATH=. python3 tests/training/test_enrich_hero_range_context.py
      - name: Validate persisted #107 PFC handoff
        run: PYTHONPATH=. python3 tests/training/test_persisted_hero_pfc_binding.py
      - name: Validate persisted PFC-keyed Hero repository
        run: |
          node - <<'JS'
          const fs=require('fs');
          const H=require('./site/hero-ranges.js');
          const path='training/runs/20260917_hero_preflop_169_btn_unopened_pfc_v1/HERO_RANGE_REPOSITORY_PFC.json';
          const repo=JSON.parse(fs.readFileSync(path,'utf8'));
          H.validateRepository(repo);
          const stats=H.repositoryStats(repo);
          if(stats.contexts!==1||stats.calculated_defined_hands!==40||stats.personal_defined_hands!==0){
            throw new Error(JSON.stringify(stats));
          }
          const key=Object.keys(repo.contexts)[0];
          if(!key.endsWith('|PFC_0e01f7d1a1da491b'))throw new Error(key);
          console.log(stats);
          JS
