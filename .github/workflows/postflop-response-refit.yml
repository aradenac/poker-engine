name: Validate Model A postflop continuation refit

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/repro-runtime/action.yml'
      - '.python-version'
      - '.node-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tools/training/refit_postflop_response_models.py'
      - 'tools/training/refit_postflop_combo_policy.py'
      - 'tools/training/sample_postflop_stage_b_decisions.py'
      - 'tools/training/model_a_latent_ranges.py'
      - 'tools/training/model_a_postflop_runtime.py'
      - 'tools/training/audit_model_a_latent_ranges.py'
      - 'tools/training/build_certified_population_decisions.py'
      - 'tests/training/test_postflop_response_refit.py'
      - 'tests/training/test_postflop_refit_protocol.py'
      - 'tests/training/test_model_a_latent_ranges.py'
      - 'tests/training/test_model_a_postflop_runtime.py'
      - 'tests/training/test_postflop_combo_refit.py'
      - 'training/datasets/NLHE_100-200/population_certification.json'
      - '.github/workflows/postflop-response-refit.yml'
  pull_request:
    paths:
      - '.github/actions/repro-runtime/action.yml'
      - '.python-version'
      - '.node-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tools/training/refit_postflop_response_models.py'
      - 'tools/training/refit_postflop_combo_policy.py'
      - 'tools/training/sample_postflop_stage_b_decisions.py'
      - 'tools/training/model_a_latent_ranges.py'
      - 'tools/training/model_a_postflop_runtime.py'
      - 'tools/training/audit_model_a_latent_ranges.py'
      - 'tools/training/build_certified_population_decisions.py'
      - 'tests/training/test_postflop_response_refit.py'
      - 'tests/training/test_postflop_refit_protocol.py'
      - 'tests/training/test_model_a_latent_ranges.py'
      - 'tests/training/test_model_a_postflop_runtime.py'
      - 'tests/training/test_postflop_combo_refit.py'
      - 'training/datasets/NLHE_100-200/population_certification.json'
      - '.github/workflows/postflop-response-refit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postflop-continuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/repro-runtime
        with:
          require-node: 'false'
      - name: Contract tests
        run: |
          python3 - <<'PY'
          import runpy
          for path in (
              'tests/training/test_postflop_response_refit.py',
              'tests/training/test_postflop_refit_protocol.py',
              'tests/training/test_model_a_latent_ranges.py',
              'tests/training/test_model_a_postflop_runtime.py',
              'tests/training/test_postflop_combo_refit.py',
          ):
              ns = runpy.run_path(path)
              for name, fn in sorted(ns.items()):
                  if name.startswith('test_') and callable(fn):
                      fn()
                      print('PASS', path, name)
          PY

      - name: Materialize certified Zoom decisions
        run: |
          python3 tools/training/build_certified_population_decisions.py \
            --certification training/datasets/NLHE_100-200/population_certification.json \
            --out /tmp/certified-decisions.jsonl \
            --summary /tmp/certified-decisions-summary.json
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/certified-decisions-summary.json'))
          assert s['population_id'] == 'pokerstars_nlhe_100-200_zoom_play_6max_v1'
          assert s['target_unique_hands'] == 23789
          assert s['hands_by_split'] == {'TRAIN': 19016, 'VALIDATION': 2324, 'TEST': 2449}
          PY

      - name: Rebuild selected Stage A response candidate
        run: |
          python3 tools/training/refit_postflop_response_models.py \
            --baseline training/models/postflop_population_model_v5.json \
            --decisions /tmp/certified-decisions.jsonl \
            --out /tmp/postflop-stage-a.json \
            --report /tmp/postflop-stage-a-report.json \
            --epochs 60 \
            --learning-rate 0.08 \
            --l2-to-parent 0.25 \
            --seed 20260915 \
            --bootstrap-iterations 2000
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/postflop-stage-a-report.json'))
          assert r['selection'] == {'split': 'VALIDATION', 'test_consumed': False}
          assert r['scientific_decision'] == 'PROMOTE_CANDIDATE_SCIENTIFICALLY'
          assert r['production_effect'] == 'NONE'
          assert r['baseline_validation']['rows'] == r['candidate_validation']['rows'] > 0
          PY

      - name: Freeze deterministic Stage B budget
        run: |
          python3 tools/training/sample_postflop_stage_b_decisions.py \
            --decisions /tmp/certified-decisions.jsonl \
            --postflop-model /tmp/postflop-stage-a.json \
            --out /tmp/stage-b-decisions.jsonl \
            --summary /tmp/stage-b-budget.json \
            --train-hands-per-model 120 \
            --validation-revealed-hands-per-model 60
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/stage-b-budget.json'))
          assert s['selection_contract']['test_consumed'] is False
          assert 'TEST' not in s['selected_unique_hands_by_split']
          assert s['selected_unique_hands_by_split'].get('TRAIN', 0) > 0
          assert s['selected_unique_hands_by_split'].get('VALIDATION', 0) > 0
          PY

      - name: Refit Stage B combo policy and evaluate VALIDATION
        run: |
          python3 tools/training/refit_postflop_combo_policy.py \
            --stage-a /tmp/postflop-stage-a.json \
            --production-baseline training/models/postflop_population_model_v5.json \
            --preflop-model training/models/preflop_population_model_v5.json \
            --decisions /tmp/stage-b-decisions.jsonl \
            --candidate /tmp/postflop-stage-b-candidate.json \
            --overlay /tmp/postflop-selected-overlay.json \
            --report /tmp/postflop-stage-b-report.json \
            --hidden-quadrature-budget 48 \
            --epochs 50 \
            --learning-rate 0.05 \
            --l2-to-parent 0.30 \
            --minimum-effective-weight 20 \
            --coefficient-delta-cap-std 1.5 \
            --validation-revealed-budget 360 \
            --seed 20260916 \
            --bootstrap-iterations 2000

      - name: Verify isolation, selection and continuation overlay
        run: |
          python3 - <<'PY'
          import json
          from tools.training.refit_postflop_combo_policy import apply_overlay

          prod = json.load(open('training/models/postflop_population_model_v5.json'))
          stage_a = json.load(open('/tmp/postflop-stage-a.json'))
          stage_b = json.load(open('/tmp/postflop-stage-b-candidate.json'))
          overlay = json.load(open('/tmp/postflop-selected-overlay.json'))
          report = json.load(open('/tmp/postflop-stage-b-report.json'))

          assert report['selection'] == {'split': 'VALIDATION', 'test_consumed': False}
          assert report['production_effect'] == 'NONE'
          assert report['gates']['target_action_leakage'] == 'PASS_BY_CONSTRUCTION'
          assert report['gates']['future_board_cards_for_prior_action'] == 'PASS_BY_CHRONOLOGICAL_BLOCKING'
          assert report['fit']['combo_policy_models_changed'] > 0
          assert report['validation']['rows'] > 0
          assert report['validation']['prediction_changed_rows'] > 0
          assert stage_b['nodes'] == stage_a['nodes']
          assert stage_b['response_models'] == stage_a['response_models']
          assert stage_b.get('hand_policy_prior') == stage_a.get('hand_policy_prior')

          selected = apply_overlay(prod, overlay)
          assert selected['nodes'] == prod['nodes']
          assert selected.get('hand_policy_prior') == prod.get('hand_policy_prior')
          for key, spec in stage_a['response_models'].items():
              assert selected['response_models'][key]['numeric_coef'] == spec['numeric_coef']
          if report['scientific_decision'] == 'PROMOTE_STAGE_B_SCIENTIFICALLY':
              expected_combo = stage_b['combo_policy_models']
          else:
              expected_combo = stage_a['combo_policy_models']
          for key, spec in expected_combo.items():
              assert selected['combo_policy_models'][key]['coef_std'] == spec['coef_std']

          print('STAGE_B_REPORT_BEGIN')
          print(json.dumps(report, indent=2))
          print('STAGE_B_REPORT_END')
          print('STAGE_B_OVERLAY_BEGIN')
          print(json.dumps(overlay, indent=2))
          print('STAGE_B_OVERLAY_END')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: model-a-postflop-stage-b-evidence
          path: |
            /tmp/certified-decisions-summary.json
            /tmp/postflop-stage-a-report.json
            /tmp/stage-b-budget.json
            /tmp/postflop-stage-b-report.json
            /tmp/postflop-selected-overlay.json
            /tmp/postflop-stage-a.json
            /tmp/postflop-stage-b-candidate.json
          retention-days: 14
