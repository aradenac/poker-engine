name: Validate Model A postflop response refit

on:
  push:
    paths:
      - 'tools/training/refit_postflop_response_models.py'
      - 'tools/training/model_a_latent_ranges.py'
      - 'tools/training/audit_model_a_latent_ranges.py'
      - 'tests/training/test_postflop_response_refit.py'
      - 'tests/training/test_postflop_refit_protocol.py'
      - 'tests/training/test_model_a_latent_ranges.py'
      - 'training/runs/20260915_model_a_postflop_refit_v1/PROTOCOL.json'
      - '.github/workflows/postflop-response-refit.yml'
  pull_request:
    paths:
      - 'tools/training/refit_postflop_response_models.py'
      - 'tools/training/model_a_latent_ranges.py'
      - 'tools/training/audit_model_a_latent_ranges.py'
      - 'tests/training/test_postflop_response_refit.py'
      - 'tests/training/test_postflop_refit_protocol.py'
      - 'tests/training/test_model_a_latent_ranges.py'
      - 'training/runs/20260915_model_a_postflop_refit_v1/PROTOCOL.json'
      - '.github/workflows/postflop-response-refit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - name: Contract tests
        run: |
          python3 - <<'PY'
          import runpy
          for path in (
              'tests/training/test_postflop_response_refit.py',
              'tests/training/test_postflop_refit_protocol.py',
              'tests/training/test_model_a_latent_ranges.py',
          ):
              ns=runpy.run_path(path)
              for name,fn in sorted(ns.items()):
                  if name.startswith('test_') and callable(fn):
                      fn()
                      print('PASS', path, name)
          PY
      - name: Rebuild normalized 2026-09-12 decisions
        run: |
          python3 tools/training/build_incremental_decisions_v2.py \
            --source training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip \
            --out /tmp/model-a-0912-decisions.jsonl \
            --summary /tmp/model-a-0912-summary.json
      - name: Audit exact latent-range subset
        run: |
          python3 tools/training/audit_model_a_latent_ranges.py \
            --preflop-model training/models/preflop_population_model_v5.json \
            --decisions /tmp/model-a-0912-decisions.jsonl \
            --out /tmp/model-a-latent-range-audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/model-a-latent-range-audit.json'))
          assert a['selection']=={'splits_consumed':['TRAIN','VALIDATION'],'test_consumed':False}
          assert a['counts']['admitted_exact_latent_targets']>0
          assert a['gates']['target_action_leakage']=='PASS_BY_CONSTRUCTION'
          assert a['gates']['nearest_context_substitution']=='DISABLED'
          PY
      - name: Refit runtime-consumed response coefficients and evaluate VALIDATION
        run: |
          python3 tools/training/refit_postflop_response_models.py \
            --baseline training/models/postflop_population_model_v5.json \
            --decisions /tmp/model-a-0912-decisions.jsonl \
            --out /tmp/postflop-response-candidate.json \
            --report /tmp/postflop-response-report.json \
            --epochs 60 \
            --learning-rate 0.08 \
            --l2-to-parent 0.25 \
            --seed 20260915 \
            --bootstrap-iterations 2000
      - name: Verify isolation and print scientific result
        run: |
          python3 - <<'PY'
          import json
          b=json.load(open('training/models/postflop_population_model_v5.json'))
          c=json.load(open('/tmp/postflop-response-candidate.json'))
          r=json.load(open('/tmp/postflop-response-report.json'))
          assert c['nodes']==b['nodes']
          assert c.get('combo_policy_models')==b.get('combo_policy_models')
          assert c.get('hand_policy_prior')==b.get('hand_policy_prior')
          assert c.get('response_models')!=b.get('response_models')
          assert r['selection']=={'split':'VALIDATION','test_consumed':False}
          assert r['production_effect']=='NONE'
          assert r['fit']['response_models_changed']>0
          assert r['baseline_validation']['rows']==r['candidate_validation']['rows']>0
          print(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: postflop-response-refit-evidence
          path: |
            /tmp/model-a-latent-range-audit.json
            /tmp/postflop-response-candidate.json
            /tmp/postflop-response-report.json
          retention-days: 14
