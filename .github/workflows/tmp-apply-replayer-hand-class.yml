name: Temporary apply replayer hand class

on:
  push:
    branches:
      - issue-73-replayer-hand-class
    paths:
      - 'tools/patches/patch_replayer_hand_class_v1.py'
      - 'tests/trainer/test_replayer_hand_class.py'
      - '.github/workflows/tmp-apply-replayer-hand-class.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-replayer-hand-class-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-73-replayer-hand-class
      - name: Apply deterministic patch
        run: python3 tools/patches/patch_replayer_hand_class_v1.py
      - name: Verify static contract
        run: python3 tests/trainer/test_replayer_hand_class.py
      - name: Verify patch idempotence
        run: |
          sha256sum site/index.html > /tmp/before.sha
          python3 tools/patches/patch_replayer_hand_class_v1.py
          sha256sum site/index.html > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
      - name: Persist assembled site
        run: |
          git config user.name 'poker-engine patch bot'
          git config user.email 'patch-bot@users.noreply.github.com'
          git add site/index.html
          if git diff --cached --quiet; then
            echo 'Site already patched.'
            exit 0
          fi
          git commit -m 'Display visible player hand classes in replayer'
          git push origin HEAD:issue-73-replayer-hand-class
