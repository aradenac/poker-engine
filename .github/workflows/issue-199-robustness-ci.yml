name: Issue 199 Model B robustness unit

on:
  push:
    branches:
      - agent-B/issue-199-model-b-robustness-v2
    paths:
      - 'tools/simulation/model_b_robustness.py'
      - 'tests/simulation/test_model_b_robustness.py'
      - '.github/workflows/issue-199-robustness-ci.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile robustness backend and tests
        run: python3 -m py_compile tools/simulation/model_b_robustness.py tests/simulation/test_model_b_robustness.py
      - name: Run issue 199 robustness unit matrix
        run: python3 tests/simulation/test_model_b_robustness.py
