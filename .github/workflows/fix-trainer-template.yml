name: Fix trainer template
on:
  push:
    paths:
      - '.github/workflows/fix-trainer-template.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patches/apply_trainer_mvp.py
      - run: node --check site/trainer.js
      - run: |
          git config user.name 'poker-engine bot'
          git config user.email 'poker-engine-bot@users.noreply.github.com'
          git add site/trainer.js
          git commit -m 'Fix trainer decision controls template'
          git push
