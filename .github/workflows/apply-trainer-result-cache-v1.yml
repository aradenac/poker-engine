name: Apply trainer result cache v1

on:
  push:
    branches: [issue-22-trainer-result-cache]
    paths:
      - '.github/workflows/apply-trainer-result-cache-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest branch head
        run: git pull --rebase origin issue-22-trainer-result-cache
      - name: Apply deterministic patch
        run: python3 tools/patches/patch_trainer_result_cache_v1.py
      - name: Validate syntax and contracts
        run: |
          node --check site/trainer.js
          python3 tests/trainer/test_trainer_static.py
          python3 tests/trainer/test_trainer_latency_contract.py
          python3 tests/trainer/test_trainer_preload_contract.py
          python3 tests/trainer/test_trainer_result_cache_contract.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-trainer-result-cache-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/trainer.js .github/workflows/apply-trainer-result-cache-v1.yml
          git commit -m 'Add bounded exact trainer verdict cache'
          git push origin HEAD:issue-22-trainer-result-cache
