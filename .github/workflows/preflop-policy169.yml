name: Validate preflop policy169 refit

on:
  pull_request:
    paths:
      - '.python-version'
      - 'tools/repro_ci_environment.py'
      - 'tools/repro_environment_identity.py'
      - 'tools/repro_container.py'
      - 'tools/repro_hardening.py'
      - 'tools/repro_environment.py'
      - 'reproducibility/environment.lock.json'
      - 'requirements.lock.txt'
      - 'package-lock.json'
      - 'reproducibility/os-base.lock.json'
      - 'reproducibility/container-base.lock.json'
      - 'reproducibility/Dockerfile.science'
      - 'reproducibility/system-packages.apt.txt'
      - 'reproducibility/apt-snapshot.lock.json'
      - 'reproducibility/system-packages.resolution.lock.json'
      - 'reproducibility/browser-identity.lock.json'
      - 'reproducibility/ubuntu-snapshot.sources'
      - 'tools/training/preflop_policy169.py'
      - 'tools/training/rebuild_preflop_increment_candidate.py'
      - 'tools/training/build_certified_population_decisions.py'
      - 'tools/training/evaluate_preflop_policy169_candidate.py'
      - 'training/runs/20260915_preflop_policy169_refit/PROTOCOL.json'
      - 'tests/training/test_preflop_policy169.py'
      - 'tests/training/test_preflop_policy169_rebuild.py'
      - 'tests/training/test_evaluate_preflop_policy169_candidate.py'
      - '.github/workflows/preflop-policy169.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflop-policy169-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Verify locked REPRO environment
        run: python3 tools/repro_ci_environment.py verify
      - name: Compile candidate path
        run: |
          python3 -m py_compile \
            tools/training/preflop_policy169.py \
            tools/training/rebuild_preflop_increment_candidate.py \
            tools/training/build_certified_population_decisions.py \
            tools/training/evaluate_preflop_policy169_candidate.py \
            tests/training/test_preflop_policy169.py \
            tests/training/test_preflop_policy169_rebuild.py \
            tests/training/test_evaluate_preflop_policy169_candidate.py
      - name: Policy representation contract
        run: python3 tests/training/test_preflop_policy169.py
      - name: Rebuild/runtime consumption contract
        run: python3 tests/training/test_preflop_policy169_rebuild.py
      - name: Frozen VALIDATION and protected TEST contract
        run: python3 tests/training/test_evaluate_preflop_policy169_candidate.py
