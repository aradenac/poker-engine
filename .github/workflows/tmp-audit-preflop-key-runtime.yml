name: Temporary audit preflop key/runtime parity

on:
  push:
    branches:
      - issue-88-preflop-canonical-runtime-parity
    paths:
      - 'tools/training/audit_preflop_key_runtime_parity.py'
      - 'tools/training/explain_preflop_key_runtime_mismatches.py'
      - 'tools/training/evaluate_preflop_free_check_matcher.py'
      - 'tests/training/test_preflop_key_runtime_parity.py'
      - 'tests/training/test_preflop_free_check_matcher.py'
      - '.github/workflows/tmp-audit-preflop-key-runtime.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit parity contracts
        run: |
          python3 tests/training/test_preflop_key_runtime_parity.py
          python3 tests/training/test_preflop_free_check_matcher.py
      - name: Audit promoted v5
        run: |
          python3 tools/training/audit_preflop_key_runtime_parity.py \
            --model training/models/preflop_population_model_v5.json \
            --out /tmp/preflop-key-runtime-parity.json \
            --examples 40
          python3 tools/training/explain_preflop_key_runtime_mismatches.py \
            --model training/models/preflop_population_model_v5.json \
            --out /tmp/preflop-key-runtime-explanation.json
      - name: Rebuild normalized 2026-09-12 decisions for held-out VALIDATION
        run: |
          python3 tools/training/build_incremental_decisions_v2.py \
            --source training/datasets/NLHE_100-200/increments/20260912/source/selected_100_200.zip \
            --out /tmp/model-a-0912-decisions.jsonl \
            --summary /tmp/model-a-0912-summary.json
      - name: Compare strict free-check matching on VALIDATION only
        run: |
          python3 tools/training/evaluate_preflop_free_check_matcher.py \
            --model training/models/preflop_population_model_v5.json \
            --decisions /tmp/model-a-0912-decisions.jsonl \
            --out /tmp/preflop-free-check-validation.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/preflop-free-check-validation.json'))
          assert r['split']=='VALIDATION'
          assert r['test_used'] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: preflop-key-runtime-parity-${{ github.sha }}
          path: |
            /tmp/preflop-key-runtime-parity.json
            /tmp/preflop-key-runtime-explanation.json
            /tmp/preflop-free-check-validation.json
          if-no-files-found: error
